<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17324d"><link rel="manifest" href="manifest.json"><title>Opos-Radio · Perfil</title><style>:root{--bg:#f3f7fb;--card:#fff;--ink:#183044;--muted:#68788b;--accent:#256b9e;--line:#dce5ee;--shadow:0 8px 28px #18304412}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#eef5fa,#f8fbfd);color:var(--ink);font-family:Arial,sans-serif;line-height:1.45}.wrap{max-width:800px;margin:auto;padding:18px 14px 90px}header{background:linear-gradient(135deg,#183044,#256b9e);color:#fff;padding:24px 18px;border-radius:0 0 28px 28px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:#fff;text-decoration:none;font-weight:700}h1{margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:16px 0;box-shadow:var(--shadow)}.profile{display:flex;align-items:center;gap:16px}.avatar{width:78px;height:78px;border-radius:22px;background:#eaf2f9;display:grid;place-items:center;font-size:2.7rem}.level{color:var(--accent);font-weight:700}.xp{height:11px;background:#e8edf3;border-radius:20px;overflow:hidden;margin:9px 0}.xp i{display:block;height:100%;background:linear-gradient(90deg,#256b9e,#7b4db7);width:0}.row{display:flex;gap:10px}.row>*{flex:1}input,select{width:100%;padding:11px;border:2px solid var(--line);border-radius:12px;font:inherit}button{border:0;border-radius:14px;padding:11px 15px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f6f9fc;border:1px solid var(--line);border-radius:16px;padding:15px;text-align:center}.stat b{display:block;font-size:1.4rem}.stat span,.small{font-size:.85rem;color:var(--muted)}.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.badge{padding:14px;border:1px solid var(--line);border-radius:16px;text-align:center}.badge.locked{opacity:.4;filter:grayscale(1)}.badge div:first-child{font-size:2rem}.tools{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -4px 18px #18304414}.tools a{color:var(--ink);text-decoration:none;text-align:center;font-size:.72rem;font-weight:700}.tools span{display:block;font-size:1.25rem}@media(max-width:600px){.badges{grid-template-columns:repeat(2,1fr)}} </style></head><body><header><div class="top"><div><h1>👤 MI PERFIL</h1><div>Tu identidad y tu progreso personal</div></div><a class="back" href="index.html">← Inicio</a></div></header><main class="wrap"><section class="card"><div class="profile"><div class="avatar" id="avatar">👩</div><div><h2 id="name" style="margin:0">Aspirante</h2><div class="level" id="level">Nivel 1 · Aspirante</div><div id="xp">0 XP</div></div></div><div class="xp"><i id="xpbar"></i></div><div class="small" id="next">100 XP para el siguiente nivel</div></section><section class="card"><h2>✏️ Personaliza tu perfil</h2><div class="row"><input id="nameInput" placeholder="Tu nombre"><select id="avatarInput"><option value="👩">👩 Chica</option><option value="👨">👨 Chico</option><option value="🧑">🧑 Chique</option></select></div><button style="margin-top:10px;width:100%" onclick="saveProfile()">Guardar perfil</button></section><section class="card"><h2>📊 Mi progreso</h2><div class="stats"><div class="stat"><b id="statXp">0</b><span>XP total</span></div><div class="stat"><b id="correct">0</b><span>Aciertos</span></div><div class="stat"><b id="answered">0</b><span>Preguntas</span></div><div class="stat"><b id="streak">0</b><span>Mejor racha</span></div><div class="stat"><b id="total">0</b><span>Retos completados</span></div><div class="stat"><b id="accuracy">0%</b><span>Precisión</span></div></div></section><section class="card"><h2>🏅 Mis insignias</h2><div class="badges" id="badges"></div></section></main><nav class="tools"><a href="index.html"><span>🏠</span>Inicio</a><a href="index.html#estudio"><span>📚</span>Estudio</a><a href="retos.html"><span>🏆</span>Retos</a><a href="perfil.html"><span>👤</span>Perfil</a></nav><script>const LEVELS=[['Aspirante',0],['Aprendiz',100],['Técnico/a en prácticas',300],['Técnico/a RX',600],['Especialista',1000],['Máquina de oposiciones',1600],['Leyenda radiológica',2500]];const BADGES=[['🩻','Primera radiografía','Completa tu primer reto',s=>s.total>=1],['💯','Perfecto','Consigue un 10/10',s=>s.perfect>=1],['🔥','Imparable','Alcanza una racha de 3',s=>s.streak>=3],['🧠','Mente clínica','Consigue 25 aciertos',s=>s.correct>=25],['🦴','Domador/a de huesos','Responde 50 preguntas',s=>s.answered>=50],['☢️','Radioprotector/a','Completa 5 retos',s=>s.total>=5],['👑','Máquina de oposiciones','Alcanza 1.000 XP',s=>s.xp>=1000],['💎','Sin fallos','Consigue 10 aciertos seguidos',s=>s.bestStreak>=10],['🚀','Racha de estudio','Completa retos en 5 días distintos',s=>s.days>=5]];let state=JSON.parse(localStorage.getItem('oposRadioGame')||'null')||{name:'Aspirante',avatar:'👩',xp:0,correct:0,answered:0,total:0,streak:0,bestStreak:0,perfect:0,days:0};function save(){localStorage.setItem('oposRadioGame',JSON.stringify(state));render()}function saveProfile(){state.name=document.getElementById('nameInput').value.trim()||'Aspirante';state.avatar=document.getElementById('avatarInput').value;save()}function render(){let idx=0;for(let i=0;i<LEVELS.length;i++)if(state.xp>=LEVELS[i][1])idx=i;let lv=LEVELS[idx],next=LEVELS[idx+1];document.getElementById('name').textContent=state.name;document.getElementById('avatar').textContent=state.avatar;document.getElementById('nameInput').value=state.name;document.getElementById('avatarInput').value=state.avatar;document.getElementById('level').textContent='Nivel '+(idx+1)+' · '+lv[0];document.getElementById('xp').textContent=state.xp+' XP';document.getElementById('xpbar').style.width=(next?Math.min(100,Math.round((state.xp-lv[1])/(next[1]-lv[1])*100)):100)+'%';document.getElementById('next').textContent=next?(next[1]-state.xp)+' XP para '+next[0]:'¡Nivel máximo!';document.getElementById('statXp').textContent=state.xp;document.getElementById('correct').textContent=state.correct;document.getElementById('answered').textContent=state.answered;document.getElementById('streak').textContent=state.bestStreak;document.getElementById('total').textContent=state.total;document.getElementById('accuracy').textContent=(state.answered?Math.round(state.correct/state.answered*100):0)+'%';document.getElementById('badges').innerHTML=BADGES.map(b=>'<div class="badge '+(b[3](state)?'':'locked')+'"><div>'+b[0]+'</div><b>'+b[1]+'</b><div class="small">'+b[2]+'</div></div>').join('')}render();</script></body></html>
