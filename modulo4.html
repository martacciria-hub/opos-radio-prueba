utton class="topicBtn" onclick="openTopic(28)"><b>TEMA 28. RADIOLOGÍA CONVENCIONAL APARATO URINARIO</b></button><button class="topicBtn" onclick="openTopic(29)"><b>TEMA 29. HISTEROSALPINGOGRAFIA</b></button><button class="topicBtn" onclick="openTopic(30)"><b>TEMA 30. RADIOLOGÍA CONVENCIONAL DENTAL</b></button><button class="topicBtn" onclick="openTopic(31)"><b>TEMA 31. RADIOLOGÍA CONVENCIONAL EN PORTÁTIL, UCI Y QUIRÓFANO</b></button><button class="topicBtn" onclick="openTopic(32)"><b>TEMA 32. RADIOLOGÍA PEDIÁTRICA</b></button><button class="topicBtn" onclick="openTopic(33)"><b>TEMA 33. ESTUDIO RADIOLÓGICO DE LA MAMA, MX Y GALACTO</b></button><button class="topicBtn" onclick="openTopic(34)"><b>TEMA 34. RADIOLOGÍA CONVENCIONAL. DENSITOMETRÍA</b></button></div></div><div id="topicView" class="card hidden"><button class="back" onclick="closeTopic()">← Volver a temas</button><div id="topicText" class="notes"></div></div></section></main><script>const topics={28:`INTRO: El aparato urinario es el conjunto de órganos encargados de la producción y evacuación de la orina. Está constituido por: riñones, uréteres, vejiga y uretra.

Los riñones, forman la orina a partir de la filtración de la sangre (contribuyendo a la regulación del medio interno). También se comporta como glándula endocrina secretando la hormona “eritropoyetina” necesaria para la producción de glóbulos rojos (hematopoyesis). Se encarga de producir “renina” que participa en la regulación de la presión arterial. Interviene en la conversión de la vitamina D3, importante en el metabolismo cálcico. Regula el pH sanguíneo, eliminando sustáncias ácidas o básicas cuando el pH se altera.

Los uréteres, transportan la orina hasta la vejiga.
La vejiga, almacena la orina.
La uretra, es el conducto de eliminación de la orina. Presenta diferentes características según el sexo.

Hombre: Tiene una longitud de 20-25cm, y se alternan dilataciones y estrechamientos con el pene flácido, hace tiene forma de S y se divide en 4 partes.
Uretra prostática ⟶ Es amplia y mide 3/3.5 cm, en ella se situa el “veru montanum” donde desemboca el orificio eyacualador y a ambos lados desembocan las gládulas prostáticas.
Uretra membranosa.
Uretra bulbar ⟶ Forma de cono, con el vértice en la uretra membranosa y va desde el lig.suspensorio hasta el diafragma urogenital. Comienza con una dilatación donde desembocan los conductos de las glándulas de Cowper, que segregan una sustancia alcalina antes de la eyaculación para preparar el pH de la uretra. En toda su longitud hay glándulas de “Littre”, al igual que en la uretra peneana.
Uretra peneana/cavernosa.

Mujer: Mide entre 2.5/4 cm y forma un arco de concavidad anterior, se sitúa entre la sínfisis y la cara anterior de la vejiga, donde hace un relieve que se llama carina uretral. Alrededor de la desenbocadura, se sitúan las glándulas “Skene” (parauretrales).

TEMA 28. RADIOLOGÍA CONVECIONAL APARATO URINARIO
UROGRAFÍA I.V / PIELOGRAFÍA I.V
Objetivo: Es un estudio funcional del sist. urinario mediante inyección I.V de contraste yodado, permitiendo estudiar la morfología y la patología de los riñones, sist. pielocaliciales, uréteres y vejiga.

CISTOGRAFÍA
Objetivo: Permite valorar vejiga, cuello vesical, y uretra, mediante la introducción de un contraste por sonda vesical.

Indicaciones principales: Incontinencia y cistocele, evaluación de malformaciones, treumatísmos con sospecha de perforación vesical, reflijo vesiculouretral, cálculos de baja densidad, lesiones polipoideas, fístulas urinarias y divertículos.

URETROCISTOGRAFÍA RETRÓGRADA Y MICCIONAL EN VARONES
Objetivo: Estudio de la uretra y la vejiga.
Indicaciones principales: Estenosis congénitgas y adquiridas, traumatismos con uretrorragia, anomalías congénitas, trastornos funcionales de la micción.
Contraindicaciones: Infección en período agudo (cistouretritis), obstrucción completa uretral (no forzamos el sondaje, puncionamos en la zona suprapúbica).

PIELOGRAFÍA RETRÓGRADA O ASCENDENTE
Objetivo: Estudio seriado retrógrado del sistema pielocalicial y del uréter en casos de uropatía obstructiva.

PIELOGRAFÍA ANTEROGRADA O DESCENDENTE
Objetivo: Estudio seriado anterógrado del sistema pielocalicial y del uréter inyectando el contraste a través del catéter de nefrostomía.

ILEOGRAFÍA
Objetivo: Esta exploración se solicita en pacientes a los que se les ha extirpado la vejiga y se ha realizado una nueva, interponiendo una asa del íleon entre los uréteres y la pared abdominal.`,29:`TEMA 29. HISTEROSALPINGOGRAFIA

Objetivo: Permite la evaluación del útero y las trompas de falopio tras introducir contraste radiopaco a través del canal cervical. Es una técnica fundamental en el estudio de infertilidad femenina, para el estudio morfológico y funcional de las trompas de falopio.

Aunque se le atribuye cierto efecto terapéutico, es un procedimiento con finalidad diagnóstica.

Indicaciones: Estudio de infertilidad; Estudio de abortos de repetición; Estudio de malformaciones uterinas congénitas; Valoración de la efectividad de métodos anticonceptivos como la ligadura de trompas o dispositivos intratubáricos.

Contraindicaciones: Posible embarazo; Enfermedad pélvica inflamatoria activa o sangrado uterino activo; Alergia grave a los contrastes yodados (aunque se puede administrar una pauta de premedicación).

Requisitos previos: No es necesaria una preparación especial, aunque es aconsejable la administración de un antiinflamatorio no esteroideo 1h antes de la prueba.

Citación: Es importante realizar la prueba en la fase folicular del ciclo para tener un endometrio fino, para que sea más fácil la interpretación de las imágenes, ideal es entre el 7º y 12º día (contando a partir del primer día de la menstruación).

Material: ⟶ Solución antiséptica (povidona yodada o clarhexidina) ⟶ Catéter puede ser S. Floey o Sistema de vacío desechable. ⟶ Contraste yodado hidrosoluble 5-10ml de baja osmolaridad. ⟶ Espéculo. ⟶ Pinzas pozzi para traccionar el cérvix si es necesario. ⟶ Medicación espasmolítica (buscapina 10mg).

Técnica: Tumbamos a la paciente en posición ginecológica y hacemos una RX de PELVIS. Limpiamos la zona genital externa y localizamos el cuello uterino mediante tacto vaginal y se coloca el espéculo. Después de purgar la sonda, se introduce por el orificio cervical externo. Rellenamos el balón con aire, y retiramos el espéculo. Empezamos a introducir el contraste a baja presión y controlando por fluoroscopio, generalmente son suficientes 5-10 ml.

Secuencia de imágenes: 1. Postcontraste inicial, con ella podremos ver los defectos de repleción o alteraciones del controno uterino. 2. Postcontraste con distensión completa de la cavidad. 3. Visualización de ambos conductos tubáricos. 4. Paso del contraste a la cavidad peritoneal en cantidad suficiente por ambas trompas. 5. Una vez obtenidas las imágenes, se retira el catéter y se realiza una rx postevacuación para comprobar la distribución libre del contraste en la cavidad peritoneal.

Nota: Pueden ser necesarias proyecciones complementarias como: 1. Con tracción del cuello, en casos de marcada anteflexión o retroreflexión. 2. Proyecciones oblicuas para desplegar el trayeco tubárico. 3. En decúbito lateral o prono en caso de no opacificarse una o ambas trompas.`,30:`TEMA 30. RADIOLOGÍA CONVENCIONAL DENTAL

FÓRMULA Y NOMENCLATURA DENTALES

En el ser humano existen dos denticiones:

⟶ DENTICIÓN DECIDUA (dientes de leche): Constituida por 20 piezas: 8 incisivos, 4 caninos, 8 premolares.
⟶ DENTICIÓN PERMANENTE: Constituida por 32 piezas: 8 incisivos, 4 caninos, 8 premolares, 12 molares.

NOMENCLARUTAS DE USO MÁS COMUN ⟶ Nomenclatura por cuadrantes de Palmer ⟶ Nomenclatura de la American Dental Association ⟶ Nomenclatura de la Feredación Dental Internacional.

INTRODUCCIÓN
Los dientes son pequeños órganos, duros, de color blanco amarillento que se disponen en forma de arco en ambos maxilares donde están incrustados en unas cavidades llamadas alveolos.

Tienen 3 funciones: ⟶ Digestiva: al realizar la masticación, los incisivos cortan, los caninos desgarran y premolares y molares trituran. ⟶ Fonética: es una función pasiva, dan apoyo a la lengua y los labios para facilitar la pronunciación. ⟶ Estética: gran parte de la estructura facial está condicionada por el soporte de los dientes a labios y mejillas. la falta de piezas (edentulismo) altera de manera significativa la morfología facial.

TERMINOLOGIA
⟶ Mesial: Es aquello que se ACERCA al plano sagital medio
⟶ Distal: Es aquello que se ALEJA del plano sagital medio
⟶ Vestibular/labial/bucal: Es la cara del diente que mira hacia FUERA, “hacia el vestíbulo de la boca”.
⟶ Lingual: Es la cara del diente que mira hacia DENTRO, “lo que toca la lengua” se usa para la arcada inferior
⟶ Palatino: Es la cara del diente que mira hacia DENTRO, “lo que mira al paladar” se usa para la arcada superior.
⟶ Planos Oclusales: Son los que pasan por la superficie masticatoria de las dos arcadas.

TÉCNICAS CONVENCIONALES DE RAD. DENTAL
INTRAORALES
⟶ Aleta de mordida (proyección bucolingual de las coronas y las crestas alveolares de los dientes tanto superiores como inferiores. Se usan para el estudio de caries o alteraciones de la pulpa.)
⟶ Rx Periapicales (proyección bucolingual de los dientes, de la membrana periodontal y del hueso circundante. Con ésta técnica los dientes se estudian por separado, la angulación del tubo variará en función de la pieza que se estudia usando de referencia los planos oclusales. Para incisivos y caninos la placa irá vertical, para premolares y molares en horizontal.)
Hay dos técnicas para ésta proyección: 1. Técnica de la bisectriz del ángulo 2. Técnica del paralelismo
⟶ Rx Oclusales (proyección intraoral que se caracteriza por situar la placa en el plano oclusal superior en el caso de las oclusales maxilares, o en el plano oclusal inferior en las oclusales mandibulares. ESTÁ EN DESUSO PRACTICAMENTE).

EXTRAORALES
⟶ Rx Oblicua Lateral (técnica en desuso, gracias a la ortopanto).
⟶ Teleradiografía lateral de cara y cráneo (cefalometría): Junto con la ortopanto son las exploraciónes básicas en odontología y en el estudio de patologías maxilofaciales. Se usa para el estudio de ortodoncia, tanto para el diagnóstico como para la planificación.
⟶ Rx Ortopantomografía: proyección muy usada, por facilidad, rapidez y baja dosis y que en una sola imagen se pueden ver las dos arcadas enteras y los tejidos de soporte.
⟶ TAC DENTAL: se usa para implantes dentales, para planificación de precirugía, ya que permite estudiar la situación de las estructuras neurovasculares y la calidad del hueso, así como lesiones en el hueso. Evita superposiciones, tiene mayor resolución de contraste y permite reconstrucciones multiplanares en 2d y 3d. Éstos estudios se pueden realizar con TC Helicoidal o Tc de haz cónico.`,31:`TEMA 31. RADIOLOGÍA CONVENCIONAL EN PORTÁTIL, UCI Y QUIRÓFANO

Los chasis, sean digitales o convencionales, se cubriran con una bolsa de plástico u otro tipo de cubierta para que no entren en contacto directo con el paciente por cuestiones de higiene y manipulación.

PROTECCIÓN RADIOLÓGICA:
1. Delantal plomado
2. Protección gonadal a paciente si es posible
3. 2m de distacia técnico-tubo al disparar
4. Avisar de viva voz que se va a disparar
5. No se dispara hasta que no se “haya ido todo el mundo”.

PROYECCIONES RADIOLÓGICAS
TX PORTÁTIL: Se hace en AP y en decúbito supino la mayoría de las veces. Según la situación del paciente debemos intentar hacerla en sedestación para “mejorar” el diagnóstico y evitar las diferencias morfológicas. Es la prueba sujeta a mayor variablididad de calidad de la imagen.

El foco debemos intentar que esté a la mayor distancia posible. (180cm si es posible)
Retirar en la medida de lo posible cables y dispositivos externos. Intentar adquirir la imagen en inspiración profunda del paciente.

ABD PORTÁTIL: Se adquiere en AP y decúbito supino, teniendo en cuenta: colocar soporte en rodillas para relajar musculatura, brazos fuera del campo, procurar que esté centrado y sin rotaciones, adquisición un par de segundos después de terminar la espiración, para que el diafragma esté es su posición más elevada y por supuesto debemos incluir todo el abdomen.

PROYECCIONES COMPLEMENTARIAS:
⟶ Tx lateral en inspiración (derrame pleural)
⟶ Tx lateral en espiración (neumotórax)
⟶ Abd lateral (neumoperitoneo)
⟶ Abd supino y rayo lateral (neumoperitoneo en paciente no movilizable)

RX ESQUELÉTICAS
Para poder realizar los movimientos necesarios, el arco está provisto de sistemas de sujeción “en todos los planos”. El ajuste de los parámetros se hace habitualmente con un sist. automático que regula la tasa de dosis a la entrada del paciente. Los equipos más nuevos, tiene la opción de fluoroscopia pulsada, en la que la radiación se activa y desactiva en cortos intervalos de tiempo durante la exposición, con ello podemos reducir la dosis.

También permiten magnificar la imagen, ya sea con zoom (no augmenta dosis a paciente) o por magnificación en el intensificador de imagen (aumentando la radiación al paciente.)

PROTECCIÓN RADIOLÓGICA:
1. Exigible delantal y protección tiroidea plomada para todo el personal (en algunos casos también usaremos guantes y gafas plomados)
2. Restringir el uso de radioscopia.
3. El arco siempre por debajo del paciente (si es posible)
4. El intensificador de imagen lo más próximo al paciente que sea posible.
5. Usar siempre fluoroscopia pulsada sin magnificación.
6. Colimar al máximo al área de interés.
7. Evitar la manipulación del paciente durante el disparo
8. OJO con las oblicuas! alejarse más del tubo.
9. Reducir al máximo el nº de placas.

TRABAJO EN QUIRÓFANO
El técnico de radiología es personal no estéril, se tendrá que mover con cuidado para no contaminar zonas estériles. Deberá ir vestido con ropa adecuada para el entorno quirúrgico y llevar el delantal plomado y las protecciones necesarias. En cuanto a la adquisición de imágenes, deberá procurar que el cirujano tenga una visión perfecta de los monitores y que el arco no interfiera la movilidad del personal de quirófano, velando por la radioprotección de todo el personal.`,32:`TEMA 32. RADIOLOGÍA PEDIÁTRICA

INTRODUCCIÓN
La radiología pediátrica se encarga de todas las técnicas desde la época prenatal hasta la edad adulta. Es necesario adaptar las técnicas de imagen, minimizando dosis, eligiendo medios de contraste más apropiados para cada prueba y edad, y también es conveniente cuidar el entorno y que el técnico desarrolle aptitudes y habilidades para el manejo de los niños.

RX DE TÓRAX
En recién nacidos, lactantes y niños mayores, la dosis de radiación de una placa en PA o AP, tiene que oscilar entre 0.05 y 0.3 mGy.
El Kilovoltaje debería oscilar entre 60Kv (para niños pequeños) y 150kV (para niños de tamaño adulto).
En cuanto a los milis intentaremos que los tiempos sean lo más reducidos posible para evitar artefactos por movimiento.
La DFP mayor de 182cm para reducir la magnificación (aunque se podrá llegar a 1m, si fuera necesario).
El foco no excederá los 2mm (rango recomendado 0.6-1.2mm).

PROCEDIMIENTOS CON FLUORSOCOPIA
La adquisición de imágenes radiográficas debe limitarse única y exclusivamente a cuando sea esencial para el diagnóstico o el procedimiento de una imagen de mayor calidad. Una imágen preliminar del área que se va a explorar, antes de la administración del contraste, puede ser útil en niños con: abdómen agudo; valorar la existencia de calcificaciones; anomalías esqueléticas y de “situs”; patrón de aireación intestinal; neumoperitoneo; evidencia de cirugías previas; catéteres y electrodos de monitorización.

MEDIOS DE CONTRASTE GASTROINTESTINALES EN PEDIATRÍA
El tipo y la cantidad de contraste están determinados por la edad del niño y el motivo de la exploración. El medio de contraste para uso gastrointestinal más usado en niños es el bario, puede administrarse por V. Oral, V. Rectal, Ostomía o Catéter. Está contraindicado si se sospecha o hay una perforación del tracto gastrointestinal, en estos casos es preferible usar contrastes yodados hidrosolubles.

ESOFAGOGRAMA Y TRACTO GASTROINTESTINAL SUPERIOR
ESOFAGOGRAMA: Se deben evaluar la anatomía y la motilidad del esógafo mediante proyecciones Ap y lateral. Debemos ver desde nasofaringe hasta el fundus gástrico.
TRACTO GASTROINTESTINAL SUPERIOR (CONTRASATE SIMPLE): Se evalua la deglución, la anatomía y la motilidad de todo el esófago, estómago y duodeno. Hay que observar directamente el paso inicial de contraste a través del duodeno para confirmar la posición de la unión duodeno-yeyunal.

INTESTINO DELGADO
En determinadas circunstancias y para determinadas indicaciones, existe la opción de estudiar el intestino delgado con RM (enteroresonancia magnética) que no implica radiación ni anestesia.

ENEMA
Consiste en una exploración del colon mediante enema de contraste guiado por fluoroscopia. Las contraindicaciones de ésta técnica incluyen evidencia de perforación del colon, colon isquémico, megacolon tóxico, shock hipervolémico, peritonitis y otra condición clínica del paciente que conlleve inestabilidad.

INVAGINACIÓN INTESTINAL
La eco es la técnica para el diagnóstico de las invaginaciones intestinales (afección grave donde una parte del intestino se introduce en otra adyacente, similar a un telescopio. Esto obstruye el flujo sanguíneo y de alimentos, causando dolor abdominal severo e intermitente, vómitos y heces sanguinolentas. Requiere atención médica urgente) La eco permite reducirla guiada por un enema de suero, lo que evita el uso de radiaciones ionizantes.

ENFERMEDAD DE HIRSCHSPRUNG
Los contrastes más comunes son el bario o los hidrosolubles, en neonatos o bebés son preferibles los hidrosolubles diluidos, el recto debe ser cateterizado con una sonda blanda ¡¡ sin llenar el globo !! , con la punta justo en el interior del recto, sin introducirla demasiado. El calibre del catéter deber ser el más pequeño posible.

ÍLEO MECONIAL DEL NEONATO
La evaluación radiológica debe preceder al intento de tratamiento no quirúrgico del íleo meconial no complicado. La contraindicación más importante es la evidencia clínica de íleo complicado, como perforaciones o pseudoquistes. Para realizar el enema, normalmente se usa contraste hidrosoluble casi isotónico.

CISTOURETROGRAFÍA MICCIONAL SERIADA
Es un estudio del tracto urinario inferior, que se ha sustituido por exploraciones con ecografía. Se requiere cateterización aséptica de la vejiga, contraste yodado, y observación con flurosocópia y grabación de las imágenes obtenidas de las estructuras opacificadas. El objetivo es evaluar la vejiga, la uretra, la antomía postoperatoria y la micción, con el fin de determinar la presencia o ausencia de anomalías vesicales y uretrales, incluido el reflujo vesicouretral.

ESCOLIOSIS
Es la alteración de la alineación de la columna vertebral, la telerradiografía de columna total el bipe es una técnica útil para confirmar la presencia de escoliosis, medir el grado de curvatura y definir el tipo.

SERIE ÓSEA
Conjunto de varias RX que engloban el estudio de todo el esqueleto, una indicación habitual es la sospecha de maltrato, displasias esqueléticas, síndromes, alteraciones metabólicas y algunas neoplasias. El objetivo es identificar anomalías focales o difusas del esqueleto y diferenciar variantes anatómicas de la normalidad de situaciones patológicas.

CONSIDERACIONES TÉCNICAS
En los niños mayores, se usa un sistema de velocidad media y una parrilla móvil para las regiones más largas, siempre usaremos la técnica de bajo kV, para obtener un adecuado contraste, el rango con el que trabajamos es de 55-70kV para esqueleto apendicular, cabeza y columna. Los milis se ajustan al kV, y la DFP de 101,6cm.`,33:`TEMA 33. ESTUDIO RADIOLÓGICO DE LA MAMA, MX Y GALACTO

El objetivo de la mamografóa, es obtener imágenes de alta resolución y con buen contraste de la estuctura interna de la mama, que permita detectar la patología de la mama, aunque sean tan sutilues como las microcalcificaciones en el carcinoma de mama.

ANATOMIA
La mama está situada en la cara anterior del tórax sobre el pectoral mayor y se extiende desde la segunda hasta la 7ª costilla, la piel tiene un grosor de entre 0.5 y 2 mm y justo debajo se sitúa la fascia superficial, que se divide en una capa superficial y otra profunda, envolviendo la mama. La capa profunda forma la fascia retromamaria y está en contacto con la fascia del pectoral, permitiendo que la mama tenga algo de movimiento, y posibilitando que los vasos sanguíneos y linfáticos la atraviesen.

La mama está dividida en compartimentos incompletos por tejido conectivo, descrito por Cooper hace 150 años y conocidos por “ligamentos de Cooper”, éstos formar una especie de picos que se unen a la piel y forman el “retinacula cutis”.

Por debajo de la piel está la grasa subcutánea, que en algunas mujeres está separada del cono de parénquima de la mama y en otras no se distingue la grasa de las estructuras glandulares.

La superficie del pezón es irregular y en él se encuentran los orificios de los ductos, hay entre 8 y 20 conductos mayores que se abren en el pezón, y cada uno de ellos definen el segmento de la glándula. Los conductos mayores se dilatan en la porción ampular y después se ramifican, de forma que los ductos segmentarios profundos se dividen en estructuras subsegmentarias y éstas se ramifican hasta formar acinos (unidades funcionales y secretoras de la glándula mamaria, encargadas de sintetizar y almacenar la leche durante la lactancia.)

La mama sufre cambios involutivos con la edad, las células acinares de los lobulillos disminuyen, el tejido conectivo se hace fibrótico... Ésta involución probablemente comienza en la tercera o cuarta década y está bastante avanzada en la menopausia.

NOMENCLATURA
Es la terminilogía usada en mamo para identificar y localizar las lesiones, el sistema más usado es el de los cuadrantes, dividiendo la mama en 4 con el pezón como centro y referencia.

TÉCNICA MX
La mamografía se hace en un equipo de RX, que consta de un generador de corriente, y una columna con un brazo giratorio que contiene el tubo de rayos, un compresor y un receptos de imagen. El tubo tiene un ánodo de molibdeno o de rodio que ayudan a tener un buen contraste del tejido mamario y pequeños puntos focales de 0.3 y 0.1mm.

Una MX de buena calidad es esencial disminuir la borrosidad haciendo una buena compresión de la mama, hay que usar parrilla antidifusora para evitar la radiación dispersa, disminuir el ruido (que depende de la calidad del haz de RX) y el grano de la película, también evitaremos artefactos que puedan estar en la piel o en la película.

MX CONVENCIONAL: El detector consta de un portachasis con parrilla antidifusora, la película radiográfica es específica para mx, el chasis se mete en la reveladora y mediante el proceso químico obtenemos la placa.

MX DIGITAL INDIRECTA: Es el mismo equipo, la diferencia la marca el chasis, la película tradicional se substituye por una lámina luminiscente fotoestimulable. El chasis se introduce en el digitalizador que convierte la información en impulsos eléctricos y la transmite a una matriz donde se “dibuja” la imagen digital de la mx.

MX DIGITAL DIRECTA: Se hace igual, pero no usamos chasis ni película ni lámina. El detector está alojado justo debajo de la mama que recibe la radiación una vez atravesada. Hay dos tipos de detectores, el fósforo-silicio amorfo o el selenio amorfo.

TOMOSÍNTESIS: Es el último avance en el diagnóstico mamográfico, es una técnica tridimensional basada en una modificación de la mx digital, el tubo hace un barrido obteniendo imágenes de dos y tres dimensiones en una sola comprasión, después podemos hacer reconstrucciones tridimensionales de 1mm de grosor.

PROYECCIONES
Es una exploración intimidante, por eso se debe explicar bien el procedimiento, haciendo hincapié en la importacia de la compresión e insistir que a mayor compresión mejor imagen y menor dosis.

Las ventajas de una buena compresión son: 1. Reducción de dosis 2. Evitar el incremento de dosis acortando el T de exposición. 3. Facilita el diagnóstico 4. Mejora la resolución espacial al disminuir las distancias entre los tejidos. 5. Reducción de la borrosidad por movimiento.

⟶ Es importante que las proyecciones sean simétricas (ya que una asimetría sutil puede ser indicativo de patología)
⟶ Es preferible hacer la MX, durante la fase postmenstrual (mamas menos hinchadas y menos sensibles)
⟶ La Mx se hace en BIPE como norma general (si viene una paciente en silla de ruedas, etc. Se hace sentada)
⟶ Algunos procedimientos intervencionistas de hacen en decúbito (la mayoría, al menos en HUB)

PROYECCIONES DE RUTINA
OML (oblicua medio lateral) el tubo se angula 45º, el pectoral mayor se ve cruzando la mitad superior de la placa.
CC (craneo caudal) El tubo se coloca con el rayo perpendicular al suelo, todo el tejido fibroglandular queda incluido en el estudio y puede verse una pequeña parte del pectoral en el borde posterior.

CALIDAD TÉCNICA DE LA MX
Deben tenerse en cuenta las siguientes consideraciones: autoevaluación del técnico y revisión por el radiólogo de la calidad de la imagen para después hacer el diagnóstico; las mamas deben estar lo más simétricas posible y proyectar la mayor cantidad de tejido posible; el pezón debe quedar de perfil; las MX deben estár rotuladas el todas las proyecciones.

PROYECCIONES ADICIONALES
CC exagerada lateralmente; Cola axilar (Cleopatra); Proyección Valle; ML (90º); LM (90º); Proyección modificada Caudo Craneal (al revés); Mama masculina.

Compresión puntual y magnificación: Cuando se comprime la mama entera, el grado de compresión que se consigue, es de su porción menos comprimible. En ocasiones, el radiólogo necesita imágenes más focales. Usando una compresor más pequeño conseguimos comprimir en la zona que necesita el radiólogo, y si además quiere magnificar la zona, lo conseguimos separando la mama del detector.

PATOLOGÍAS DE LA MAMA
La mamografía, es actualmente el mejor método de cribado poblacional. Se ha establecido una clasificación con los hallazgos de la MX, conocido como BIRADS (breast Imaging Resporting Data System) para estandarizar los resultados de la mx, unificar redultados de informes radiológicos y facilitar el análisis y la actitud terapéutica. Aunque hay que tener en cuenta que no todas las lesiones son “malas”.

Lesiones Benignas: 1. Mastopatía fibroquistica y displasia mamaria. 2. Fibroadenoma. 3. Quistes.
Lesiones Malignas: El carcinoma de mama es el tipo de cáncer más frecuente en la mujer. El tipo histológico de cáncer de mama más frecuente es el carcinoma ductal (90%), seguido del carcinoma lobulillar (5/10%) y por último la enfermedad de Paget (1-5%). En general son lesiones firmes y duras cuando son palpables y pueden estar ancladas a la piel o a las estructuras profundas de la pared torácica. En la MX, el cáncer de mama puede tener diferentes presentaciones, generalmente se ve una masa definida con márgenes espiculados o estrellados, un área de asimetría o microcalcificaciones sospechosas.

PROTESIS MAMARIAS
Hay dos localizaciones respecto al tejido mamario en que pueden colocarse: Retroglandular y Retropectoral. Para hacer la MX, se usan las proyecciones estandar solo que aplicando la técnica Eklund, que básicamente es empujar la prótesis hacia atrás y “traccionar” el tejido mamario hacia delante.

⟶ BAG (Biopsia con Aguja Gruesa)
⟶ BEP (Biopsia escisional percutánea)
⟶ Galactografía
⟶ Localización de lesiones con arpón

Galactografía, para estudiar los conductos galactofóros a través de un contraste yodado hidrosoluble radiopaco. Se canaliza el orificio del conducto y se introduce un pequeño catéter, se introduce el contraste hasta que haya reflujo y se hacen dos proyecciones CC y LAT, sin aplicar compresión. Se indica en casos de secreción patológica por el pezón.`,34:`TEMA 34. RADIOLOGÍA CONVENCIONAL. DENSITOMETRÍA

INTRODUCCIÓN:
La osteoporosis, consiste en la disminución de la masa ósea y de su resistencia mecánica, que condiciona en un aumento de la incidencia de fracturas.
La densitometría, es la técnica diagnóstica que permite medir la densidad mineral del hueso.

Hay diferentes zonas de estudio: D. de cuerpo entero; D de columna vertebral; Valoración de la integración de prótesis de cadera; lipodistrofia en pacientes con el virus de la inmunodeficiencia humana.

TIPOS DE DENSITOMETRÍA
Existen diferentes técnicas para medir la densidad mineral ósea basadas en el TC, la ecografía o la RM e isopos (absociometría fotónica simple y dual). Aunque la absormetría con RX dual o de doble energía DXA, es la técnica de elección para cuantificar la masa ósea DMO (densidad mineral osea), que es el parámetro usado tanto para diagnósticode osteoporosis como en la monitorización de la respuesta al tratamiento.

ABSORCIONMETRÍA CON RX DE DOBLE ENERGÍA:
La tecnología varía tanto en hardware (filtros, voltaje) y software (algoritmo) como en la geometría del haz, los equipos consisten en una fuente de RX y un detector de alta resolución. La fuente (tubo de RX) de baja dosis, los equipos de DXA se basan en la energía dual, osea, producen fotones de dos niveles de energía.
⟶ 1: Emisión alternante de radiación de alto y bajo kilovoltaje
⟶ 2: Un haz monoenergético al que se le añade un filtro de tierras raras para absorber energía separando los fotones de alta y baja energía.

Según la morfología del haz, hay dos tipos de equipos:
HAZ EN LAPICERO ⟶ colimador puntual, se registra con un único detector.
HAZ EN ABANICO ⟶ colimador en hendidura, precisa un detector múltiple.

ABSORCIONMETRÍA CON RX DE DOBLE ENERGÍA PORTÁTIL (esqueleto periférico)
Son más pequeños y baratos, pero también menor fiabilidad, sirver como técnica de cribado para seleccionar pacientes que deben someterse a estudio con mesa estable. El estudio con portátil se hace en la falange media del tercer dedo de la mano no dominante.

ABSORCIONMETRÍA CON RX DE DOBLE ENERGÍA MESA ESTABLE (esqueleto axial)
Es el equipo más usado para el estudio de osteoporosis estudiando las regiones de columna lumbar y cadera.

PROTOCOLOS DE ESTUDIO EN MESA ESTABLE
Preparación del estudio: los pacientes no requieren una preparación específica, aunque es importante interrogar al paciente para saber: 1. Contraindicaciones: embarazo, contraste oral 5 días antes, estudios de medicina nuclear 2 días antes. 2. Lesiones o enfermedades óseas: fracturas, espondilitis. 3. debemos retirar todos los objetos metálicos. 4. antes de empezar el técnico mete todos los datos del paciente en la máquina. 5. Explicación del estudio y la necesidad de permanecer quieto durante el estudio.

Regiones de estudio en ADULTOS: el estudio se realiza generalmente en columna lumbar (L1-L4) y fémur proximal, añadiremos el antebrazo en pacientes en los que una de las áreas anteriores no sirva, o en pacientes con hiperparatiroidismo, ya que en ellos el antebrazo se suele afectar de manera precoz.
Regiones de estudio en NIÑOS y ADOLESCENTES(-20): Sólo se estudia el área lumbar.

COLOCACIÓN DEL PACIENTE Y CENTRAJE
Columna lumbar PA ⟶ Paciente en decúbito en el centro de la mesa, y alineado con su eje, las rodillas flexionadas sobre un soporte para reducir la lordosis y acercar la columna a la mesa. El centraje se hace poniendo la luz del laser en el punto en el que se quiera empezar. La adquisición empieza desde la región inferior L5, hasta D12. Para el estudio de columna lumbar sería unos 5cm por debajo del ombligo o ligeramente por debajo del nivel de cresta ilíaca.

Cadera ⟶ La densitometría de fémur se puede hacer en cualquiera de las dos, pero es útil acostumbrarse a hacer siempre la misma, a no ser que no se pueda por fracturas, etc. Ponemos al paciente en decúbito centrado en la mesa con la pierna en abducción para mantener recto el eje del fémur y en rotación interna de 15-30º.

Antebrazo ⟶ Se estudia el no dominante, el paciente se coloca sentado al lado de la mesa con el antebrazo apoyado y con la mano en pronación y sujeta con unas bandas. El centraje se hace en el centro de la muñeca a la altura de la estiloides cubital.

COLOCACIÓN DEL ÁREA DE ANÁLISIS
Columna lumbar ⟶ La ROI se situa en los cuerpos vertebrales L1 a L4, y el valor útil para el estudio es la DMO media de las cuatro vértebras, se deben excluir del análisis, las vértebras con fractura o lesión ya que alterarían la media.
Cadera ⟶ El área de análisis se debe situar en el cuello femoral, evitando la rama isquiopubiana. Lo más importante es el fémur tanto el cuello como en su totalidad.
Antebrazo ⟶ La ROI se sitúa en la extremidad distal del radio con la línea de referecia en la estiloides cubital, la región más importante es el radio.

INTERPRETACIÓN DEL ESTUDIO, TERMINILOGÍA
⟶ Contenido mineral óseo: Cantidad de calcio CONCRETA
⟶ Densidad mineral ósea: Cantidad MEDIA de calcio por unidad de área (g/cm2) o volumen (g/cm3) y se calcula dividiendo el contenido mineral óseo por un área o volumen.
⟶ Puntuación T: Sirve para el diagnóstico de osteoporosis es mujeres posmenospáusicas y se usa también en hombres mayores de 50 años. Ésta puntuación, es el número de desviaciones estándar de diferencia entre el valor de DMO del paciente y la media de una población de referencia adulta joven de la misma raza y sexo.
1. Normal: puntuación T >-1,0
2. osteopenia: puntuación T entre -1 y -2,5
3. osteoporosis: puntuación T <-2,5.
⟶ Puntuación Z: Se usa en niños y adolescentes (hasta los 20 años) y también para mujeres premenopáusicas y hombres -de 50 años. Es el número de desviaciones estándar de diferencia entre el valor DMO del paciente y la media de una población de referencia de la misma raza, sexo y edad. Con puntuación Z inferior a -2, el diagnóstico es “densidad ósea baja para la edad”.
