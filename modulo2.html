<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17324d"><title>Opos-Radio · Módulo 2</title><style>:root{--b:#f4f7fa;--c:#fff;--t:#183044;--a:#256b9e;--ok:#2e8b57;--bad:#c94c4c;--bd:#d9e2ea}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Arial,sans-serif;line-height:1.55}header{background:var(--t);color:#fff;text-align:center;padding:22px 15px}header h1{margin:0}.tabs{display:flex;gap:8px;max-width:900px;margin:auto;padding:12px 14px;background:#fff;border-bottom:1px solid var(--bd)}.tabs button{flex:1;border:2px solid var(--bd);border-radius:12px;background:#fff;padding:12px;font-weight:bold;color:var(--t);cursor:pointer}.tabs button.active{background:var(--a);color:#fff;border-color:var(--a)}main{max-width:900px;margin:auto;padding:18px 14px}.card{background:var(--c);border:1px solid var(--bd);border-radius:18px;padding:20px;box-shadow:0 3px 14px #18304412}.hidden{display:none}.topic{border:2px solid var(--bd);border-radius:14px;background:#fff;padding:16px;margin:10px 0;cursor:pointer}.topic b{display:block}.notes{white-space:pre-wrap;line-height:1.65}.back,.next,.restart{border:0;border-radius:12px;padding:13px;font-weight:bold;cursor:pointer}.back{background:none;color:var(--a)}.next,.restart{background:var(--a);color:#fff;width:100%;margin-top:14px}.opt{display:block;width:100%;text-align:left;margin:10px 0;border:2px solid var(--bd);border-radius:13px;background:#fff;color:var(--t);padding:14px;cursor:pointer}.correct{background:#e9f7ef!important;border-color:var(--ok)!important}.wrong{background:#fdeeee!important;border-color:var(--bad)!important}.score{text-align:center;font-size:3rem;color:var(--a);font-weight:bold}.feedback{margin-top:12px;padding:12px;background:#f2f6f9;border-left:5px solid var(--a)}.small{color:#607080}</style></head><body><header><h1>🩻 OPOS-RADIO</h1><div>📗 MÓDULO 2 · RADIOLOGÍA DIGITAL</div></header><nav class="tabs"><button id="bt" class="active" onclick="sec('temas')">📚 TEMAS</button><button id="bx" onclick="sec('tests')">📝 TESTS</button></nav><main><section id="temas"><div id="lista" class="card"><h2>📗 MÓDULO 2 · RADIOLOGÍA DIGITAL</h2><div id="topics"></div></div><div id="view" class="card hidden"><button class="back" onclick="back()">← Volver al módulo</button><div id="text" class="notes"></div></div></section><section id="tests" class="hidden"><div id="menu" class="card"><h2>📝 Tests · Módulo 2</h2><p>Elige el tema que quieres practicar.</p><div id="testList"></div></div><div id="quiz" class="card hidden"><div id="counter"></div><h2 id="q"></h2><div id="opts"></div><div id="fb" class="feedback hidden"></div><button id="next" class="next hidden" onclick="nextQ()">Siguiente</button></div><div id="result" class="card hidden"><h2>🏆 Resultado</h2><div id="score" class="score"></div><p id="msg" style="text-align:center"></p><button class="restart" onclick="showTests()">← Volver a los tests</button></div></section></main><script>
const topics={
6:`TEMA 6. INTRODUCCIÓN A LA IMAGEN DIGITAL\n\nINTRODUCCIÓN\nYa sabemos que para obtener imágenes disponemos de diferentes técnicas Radiaciones Ionizantes/Ondas de Radiofrecuencia/Ultrasonidos...\n\nEn los inicios las imágenes eran analógicas y se necesitaba un fluoroscopio para poder visualizarlas, con el tiempo aparecieron otras modalidades en las que el proceso era electrónico como la ECO, o por ordenador como el TAC y la RESO. Con ellas se inició la digitalización, produciendo la aparición, el desarrollo y perfeccionamiento de los sistemas de informática en diagnóstico por imagen, que permiten SISTEMIZAR, ORGANIZAR y GESTIONAR (RIS y PACS) la ingente cantidad de imágenes producidas.\n\nIMAGEN ANALÓGICA E IMAGEN DIGITAL\nTERMINOLOGÍA BÁSICA (lenguaje informático)\nBit ⟶ (binary digit) es la unidad básica de información\nByte ⟶ (B) es la unidad básica de almacenamiento de información, es una secuencia de 8 bits.\nPíxel ⟶ (elemento de imagen) es la unidad más pequeña de color homogéneo en una imagen.\nProfundidad de color ⟶ Indica el número de colores diferentes puede tener un píxel (se indica en bits)\nMatriz ⟶ Es el número total de píxel de una imagen\nResolución ⟶ Es la densidad de píxeles por unidad de superficie => Pixeles por pulgada (ppi)\n\nDIFERENCIAS ENTRE ANALÓGICA Y DIGITAL\nANALÓGICA: Los Rx impresionan la placa después de atravesar al paciente.\nDIGITAL: Los Rx, se recogen y cuantifican a la llegada a cada pixel y se les da un valor numérico. Como resultado tenemos un archivo electrónico en el que están cuantificados los valores de color de cada píxel.`,
7:`TEMA 7. IMÁGENES DIGITALES EN RADIOLOGÍA Y EL ESTÁNDAR DICOM\n\nMODALIDADES DIGITALES EN DIAGNÓSTICO POR IMAGEN\nLa modalidad se refiere a cualquier dispositivo o aparato capaz de generar imágenes diagnósticas. Cada tipo de imagen tiene propiedades específicas: abreviatura y denominación, proceso de generación, descripción, características de la imagen final y utilidad clínica.\n\n1. CR (Radiografía Computarizada): Imagen radiográfica digital basada en la captura mediante un soporte de imagen sensible a los Rx. Consta de CHASIS, tiene 12 Bits y se usa en CONVENCIONAL.\n2. Dx (Radiografía Digital): El Chasis es digital, también tiene 12 bits y su uso es CONVENCIONAL.\n3. Rf (Fluoroscopia por Rx): Imagen radioscópica y radiográfica digital mediante PANEL PLANO o INTENSIFICADOR. Permite visualizar, almacenar y crear secuencias dinámicas. Ej.: Telemando/Arco quirúrgico.\n4. XA (Angiografía Digital): Panel plano digital de alta resolución, secuencias dinámicas y elevado número de cuadros por segundo. Puede obtener imágenes 3D.\n5. Mg (Mamografía): Sistema adaptado al tejido mamario. Puede usar equipos convencionales o panel plano, tubos con ánodos de molibdeno o rodio y sistemas de alta resolución.\n6. CT (TAC): Un haz fino gira en el plano axial; los detectores capturan los Rx y se obtiene información volumétrica que se procesa y reconstruye. Componentes: Gantry, mesa y consola.\n7. MR (Resonancia Magnética): Analiza la respuesta de los tejidos a ondas electromagnéticas. Utilidad clínica muy amplia, especialmente en partes blandas.\n8. US (ECO): Analiza la reflexión de ultrasonidos. Modos B, A, M y D (Doppler).\n9. BD (Densitometría): Valora la densidad cálcica ósea mediante Rx de dos energías. T-score: adulto joven; Z-score: adulto ajustado.\n10. NM (Medicina Nuclear): Estudia la distribución de un compuesto mediante detección de radiación gamma, habitualmente con gamma cámara.\n11. PT (PET): Detecta la radiación gamma producida por la aniquilación de un positrón con un electrón. Se usa fundamentalmente en oncología, neurología y cardiología.\n\nEL ESTÁNDAR DICOM\nImágenes y comunicaciones en medicina. Surge por la necesidad de compatibilidad e interoperabilidad entre fabricantes.\nFunciones: transmisión y almacenamiento de objetos completos, petición y recuperación, seguimiento de acciones, gestión del flujo de tareas y verificación de calidad y consistencia.\nPrincipio SCU/SCP: el cliente solicita una acción y el servidor la ejecuta.\nDICOM no es sólo un formato de imagen: es una sintaxis de transferencia para la comunicación entre equipos. La unidad funcional es el par servicio-objeto (SOP).\n\nARCHIVO DICOM\nPreámbulo ⟶ primeros 128 bytes.\nPrefijo ⟶ siguientes 4 bytes.\nCabeza ⟶ contiene metadatos: TAG, Value Representation, Value Length y Value.\nDatos ⟶ valores de cada píxel.`,
8:`TEMA 8. RADIOGRAFÍA SIMPLE Y MAMOGRAFÍA DIGITAL (DISPOSITIVOS DE CAPTURA)\n\nSISTEMA CR\nFue el primer sistema desarrollado para la radiografía digital. Elementos principales: chasis convencional, soporte de imagen y lector.\nEl soporte de imagen necesita ser procesado por un lector después de ser expuesto a los Rx. El lector obtiene el archivo bruto y borra la información inútil; el soporte se vuelve a cargar en el chasis.\n\nPRINCIPIOS BÁSICOS\nLa captura se basa en compuestos químicos capaces de reaccionar ante la energía de los Rx. El FLUOROBROMURO DE BARIO es el compuesto más usado. Al irradiarse almacena energía y, al iluminarse con láser, libera luz ultravioleta: LUMINISCENCIA FOTOESTIMULADA.\nEl fotomultiplicador recoge la luz UV proporcional a la radiación recibida y un conversor A/D transforma la información en números. El soporte se borra con luz blanca intensa y queda listo para reutilizarse.\n\nPROCESADO DIGITAL\nSe realiza en la estación de trabajo, con software de análisis y transformación, identificación de pacientes, lista de trabajo y comunicaciones DICOM.\n\nSISTEMA DX\nUsa en un mismo dispositivo el material de captura de Rx y la electrónica de lectura (FLAT PANEL). El proceso se realiza en tiempo real y en pocos segundos se obtiene la imagen digital.\n\nTECNOLOGÍAS DE CAPTURA\n1. Captura directa ⟶ La radiación se transforma directamente en señal eléctrica. Selenio amorfo + matriz de condensadores/transistores TFT + base de cristal + conversor A/D.\n2. Captura indirecta ⟶ Los fotones de Rx se convierten primero en luz y después en carga eléctrica. Centelleador de yoduro de cesio u oxisulfuro de gadolinio + fotodiodos de silicio amorfo + base de cristal + A/D.\n3. Paneles planos (Flat-Panel) ⟶ integrados, portátiles o casetes inalámbricos. Usos: radiografía general, vascular y mamografía con modificaciones específicas.\n4. Sistemas DDC ⟶ usados principalmente con intensificadores de imagen. Componentes: centelleador, panel CCD y conversor A/D. Usos: radioscopia/radiografía, dental/maxilofacial y localizaciones de biopsia en mamografía.\n\nMAMOGRAFÍA DIGITAL\nLos sistemas deben mejorar resolución espacial y contraste. Tecnologías: CR/DX, DX de captura directa y acoplamiento óptico/recuento de fotones.`,
9:`TEMA 9. FUNDAMENTOS DEL PROCESADO Y APLICACIONES BÁSICAS Y AVANZADAS\n\nINTRODUCCIÓN\nLa radiografía digital facilita y optimiza los procesos, permitiendo obtener imágenes con mayor capacidad diagnóstica.\n\nVENTAJAS\n1. Calidad de imagen y reducción de dosis: mayor rango dinámico y menor rechazo de imágenes.\n2. Separación entre adquisición y presentación: permite modificar contraste/brillo, ventana/nivel, realzar bordes, zoom, recorte e inversión.\n3. Archivo digital: duplicados perfectos, copias de seguridad, transferencia y consulta remota.\n4. Aplicaciones adaptadas: sustracción dual, detección asistida por ordenador y tomosíntesis.\n\nCARACTERÍSTICAS DEL DETECTOR DIGITAL\nRango dinámico ⟶ capacidad de detectar distintas densidades del organismo.\nEficiencia de detección cuántica (DQE) ⟶ relación entre el ruido que entra y el que sale del detector. El tamaño del píxel condiciona la DQE: cuanto más pequeño, menor DQE y más ruido. Se busca un compromiso entre resolución espacial y ruido.\n\nPROCESAMIENTO BÁSICO\nImagen ADQUIRIDA ⟶ sale del detector y recibe correcciones automáticas.\nImagen DICOM ⟶ imagen bruta tras las correcciones.\nImagen DICOM para PRESENTACIÓN ⟶ imagen final procesada.\n\nPROCESADOS\n1. Realce de contraste ⟶ ajuste de ventana. NIVEL determina el tipo de tejido y ANCHURA determina la escala de grises.\n2. Corrección de sobreexposición ⟶ puede compensar una exposición excesiva, pero puede generar más ruido.\n3. Ecualización tisular ⟶ diferencia tejidos con distintas densidades.\n4. Realce de bordes ⟶ mejora interfaces y contornos. Todo realce implica aumento de ruido.\n5. Específicos para mamografía ⟶ acentúan pequeñas diferencias de densidad.\n\nPROCESAMIENTO AVANZADO DUAL\nSe basa en que la atenuación depende de la energía de los fotones. Con energías diferentes se pueden diferenciar estructuras.\nENERGÍA DUAL DE DOBLE DISPARO ⟶ permite obtener imagen convencional, valoración ósea y valoración de partes blandas.\nENERGÍA DUAL EN MAMOGRAFÍA ⟶ mamografía con contraste yodado para detectar zonas de captación.\n\nTOMOSÍNTESIS\nObtiene planos tomográficos mediante múltiples disparos en distintos ángulos (-15º a +15º). Permite separar estructuras superpuestas y navegar entre cortes. Usos: radiología torácica y mamografía. En mama: 2D, 3D y Combo.`,
10:`TEMA 10. INTEGRACIÓN DE LA IMAGEN DIGITAL EN EL PROCESO RADIOLÓGICO\n\nDEFINICIÓN\nSon una serie de actividades estructuradas que permiten obtener información con un valor añadido y así mejorar la atención al paciente.\n\nPROCESO RADIOLÓGICO\n1. Aplicación de la definición ⟶ Antes de poder hacer una radiografía existe un proceso coordinado: petición ⟶ imagen (información de valor añadido) ⟶ diagnóstico y tratamiento.\n2. Ingeniería y reingeniería del proceso ⟶ INGENIERÍA es la puesta en marcha del proceso, definiendo acciones y roles. REINGENIERÍA es la actuación y modificación sobre el proceso ya definido. Es necesaria por la transformación constante, el paso de A/D y la aparición de RIS y PACS.\n\nFASES\n⟶ Análisis del sistema antiguo\n⟶ Análisis del cambio tecnológico: avances en modalidades, RIS, PACS y DICOM\n⟶ Diseño del nuevo proceso\n⟶ Gestión del cambio: instalación y adecuación de sistemas, datos maestros, comunicación y formación y comprobación del funcionamiento\n⟶ Evaluación y mejoras continuas`,
11:`TEMA 11. SISTEMAS DE INFORMACIÓN EN RADIOLOGÍA (RIS, PACS) Y SU COMUNICACIÓN CON EL RESTO DE SISTEMAS DE INFORMACIÓN SANITARIOS\n\nDEPARTAMENTO DE RADIOLOGÍA DIGITAL\nSe basa en las imágenes digitales generadas por cualquier modalidad: radiología simple, TAC, Reso, MN y modalidades de fusión. Trabaja con PACS para Archivar, Ver, Manipular y Comunicar.\nLa gestión de RIS permite Agendar, Citar, Registrar procesos, dar soporte al proceso informado y gestionar materiales.\n\nPACS\nPrincipales componentes:\n⟶ Servidor central\n⟶ Sistema de archivo (corto, medio y largo plazo)\n⟶ Modalidades que generan imágenes\n⟶ Estaciones de diagnóstico y revisión\n⟶ Red de transmisión de datos.\n\nRIS\nGestiona toda la actividad del sistema de radiología, tanto asistencial como administrativa y de gestión.\nDebe ser: Completo, Personalizado, Robusto, Flexible e integrado.`};

distancia','Contraste y latitud'],0],['En el ajuste de ventana, el nivel determina:',['El tipo de tejido mostrado','La cantidad de píxeles','El tamaño del detector','La dosis'],0],['Las ventanas estrechas ofrecen:',['Más grises y menos contraste','Menos grises y mayor contraste','Menos resolución siempre','Más ruido siempre'],1],['Todo realce de bordes implica:',['Disminución del ruido','Aumento del ruido','Eliminación del contraste','Menor resolución'],1],['La tomosíntesis obtiene imágenes mediante:',['Un único disparo','Múltiples disparos en distintos ángulos','Solo ultrasonidos','Solo RM'],1],['La energía dual permite diferenciar estructuras según sus diferencias de:',['Atenuación','Temperatura','Movimiento','Color natural'],0]],10:[['La reingeniería consiste en:',['Definir por primera vez un proceso','Modificar un proceso ya definido','Eliminar el proceso','Sustituir al técnico'],1],['¿Cuál es una fase del cambio del proceso?',['Análisis del sistema antiguo','Eliminar RIS','Quitar DICOM','Evitar formación'],0],['RIS y PACS son ejemplos de:',['Cambios tecnológicos que afectan al proceso','Radiación','Contraste','Detectores'],0]],11:[['PACS se utiliza principalmente para:',['Archivar, ver, manipular y comunicar imágenes','Revelar películas','Generar rayos X','Administrar contraste'],0],['RIS gestiona:',['Solo las imágenes','La actividad asistencial, administrativa y de gestión','Solo el PACS','Solo el tubo'],1],['¿Cuál es un componente del PACS?',['Servidor central','Filamento','Ánodo','Colimador'],0],['El sistema de archivo PACS puede ser:',['Solo corto plazo','Corto, medio y largo plazo','Solo temporal','Solo local'],1],['RIS debe ser:',['Completo, personalizado, robusto, flexible e integrado','Solo rápido','Analógico','Independiente'],0]]};
const names={6:'TEMA 6 · Introducción a la imagen digital',7:'TEMA 7 · Imágenes digitales y estándar DICOM',8:'TEMA 8 · Radiografía simple y mamografía digital',9:'TEMA 9 · Procesado y aplicaciones básicas y avanzadas',10:'TEMA 10 · Integración de la imagen digital',11:'TEMA 11 · RIS, PACS y sistemas sanitarios'};let t=6,i=0,score=0;function sec(s){document.getElementById('temas').classList.toggle('hidden',s!=='temas');document.getElementById('tests').classList.toggle('hidden',s!=='tests');document.getElementById('bt').classList.toggle('active',s==='temas');document.getElementById('bx').classList.toggle('active',s==='tests');if(s==='tests')showTests()}function render(){document.getElementById('topics').innerHTML=Object.keys(topics).map(n=>`<div class="topic" onclick="openT(${n})"><b>${names[n]}</b></div>`).join('')}function openT(n){document.getElementById('lista').classList.add('hidden');document.getElementById('view').classList.remove('hidden');document.getElementById('text').textContent=topics[n]}function back(){document.getElementById('lista').classList.remove('hidden');document.getElementById('view').classList.add('hidden')}function showTests(){document.getElementById('menu').classList.remove('hidden');document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('testList').innerHTML=Object.keys(tests).map(n=>`<div class="topic" onclick="start(${n})"><b>📝 ${names[n]}</b><br><span class="small">${tests[n].length} preguntas</span></div>`).join('')}function start(n){t=n;i=0;score=0;document.getElementById('menu').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQ()}function showQ(){let x=tests[t][i];document.getElementById('counter').textContent=`Pregunta ${i+1} de ${tests[t].length}`;document.getElementById('q').textContent=x[0];document.getElementById('opts').innerHTML='';document.getElementById('fb').classList.add('hidden');document.getElementById('next').classList.add('hidden');x[1].forEach((a,j)=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${'ABCD'[j]})</b> ${a}`;b.onclick=()=>answer(j,b);document.getElementById('opts').appendChild(b)})}function answer(j,b){let x=tests[t][i],bs=[...document.querySelectorAll('.opt')];bs.forEach(z=>z.disabled=true);if(j===x[2]){score++;b.classList.add('correct')}else{b.classList.add('wrong');bs[x[2]].classList.add('correct')}document.getElementById('fb').classList.remove('hidden');document.getElementById('fb').innerHTML=`${j===x[2]?'✅ Correcta':'❌ Incorrecta'}<br>Respuesta: <b>${x[1][x[2]]}</b>`;document.getElementById('next').textContent=i===tests[t].length-1?'Ver resultado 🏆':'Siguiente pregunta →';document.getElementById('next').classList.remove('hidden')}function nextQ(){if(i<tests[t].length-1){i++;showQ()}else{document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');let p=Math.round(score/tests[t].length*100);document.getElementById('score').textContent=(score/tests[t].length*10).toFixed(1)+'/10';document.getElementById('msg').innerHTML=`${score}/${tests[t].length} aciertos · ${p}%<br><b>${p>=90?'🔥 ¡Nivelazo!':p>=70?'💪 ¡Muy bien!':p>=50?'📚 A repasar':'🧠 Vamos a reforzar el tema'}</b>`}}render();showTests();</script></body></html>
