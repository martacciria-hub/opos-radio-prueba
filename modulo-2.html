28:`TEMA 28. RADIOLOGÍA CONVENCIONAL APARATO URINARIO\n\nINTRO: El aparato urinario es el conjunto de órganos encargados de la producción y evacuación de la orina. Está constituido por: riñones, uréteres, vejiga y uretra.\n\nLos riñones, forman la orina a partir de la filtración de la sangre (contribuyendo a la regulación del medio interno).\nTambién se comporta como glándula endocrina secretando la hormona “eritropoyetina” necesaria para la producción de glóbulos rojos (hematopoyesis).\nSe encarga de producir “renina” que participa en la regulación de la presión arterial.\nInterviene en la conversión de la vitamina D3, importante en el metabolismo cálcico\nRegula el pH sanguíneo, eliminando sustáncias ácidas o básicas cuando el pH se altera.\n\nLos uréteres, transportan la orina hasta la vejiga\nLa vejiga, almacena la orina\nLa uretra, es el conducto de eliminación de la orina. Presenta diferentes características según el sexo\n                 Hombre: Tiene una longitud de 20-25cm, y se alternan dilataciones y estrechamientos con el pene flácido (hace\n                                 tiene forma de S y se divide en 4 partes\n                  Uretra prostática ⟶ Es amplia y mide 3/3.5 cm, en ella se situa el “veru montanum” donde desemboca el orificio\n                                                    eyacualador y a ambos lados desembocan las gládulas prostáticas.\n                  Uretra membranosa\n                  Uretra bulbar ⟶ Forma de cono, con el vértice en la uretra membranosa y va desde el lig.suspensorio hasta el\n                                               diafragma urogenital. Comienza con una dilatación donde desembocan los conductos de las\n                                                glándulas de Cowper, que segregan una sustancia alcalina antes de la eyaculación para preparar\n                                                el pH de la uretra. En toda su longitud hay glándulas de “Littre”, al igual que en la uretra\n                                                peneana.\n                  Uretra peneana/cavernosa\n\n                  Mujer: Mide entre 2.5/4 cm y forma un arco de concavidad anterior, se sitúa entre la sínfisis y la cara anterior de\n                              la vejiga, donde hace un relieve que se llama carina uretral. Alrededor de la desenbocadura, se sitúan las\n                              glándulas “Skene” (parauretrales).\n\nUROGRAFÍA I.V / PIELOGRAFÍA I.V\nObjetivo: Es un estudio funcional del sist. urinario mediante inyección I.V de contraste yodado, permitiendo estudiar la morfología y la patología de los riñones, sist. pielocaliciales, uréteres y vejiga.\n\nCISTOGRAFÍA\nObjetivo: Permite valorar vejiga, cuello vesical, y uretra, mediante la introducción de un contraste por sonda vesical\n\nIndicaciones principales: Incontinencia y cistocele, evaluación de malformaciones, treumatísmos con sospecha de perforación vesical, reflijo vesiculouretral, cálculos de baja densidad, lesiones polipoideas, fístulas urinarias y divertículos.\n\nPaciente masculino\n\nPaciente femenina\n\n1ra imagen (mucograma)\n\n2da imagen (1er deseo de miccionar) anotar cantidad de contraste introducido hasta el momento\n\n3ra imagen (Vejiga en máximo capacidad) anotar cantidad de contraste introducido hasta el momento, y no se pone +\n\nSe pone al paciente en bipe y se hacen dos proyecciones oblicuas\n\nNOTA: En pacientes femeninas,estando en bipe, se les pide que hagan esfuerzo (técnica valsava) para valorar si hay “cistocele” Se retira la sonda y se le indica al paciente que empiece a miccionar, mientras realizamos rx seriadas del proceso de micción\n\nÚltima imagen, POSTMICCIONAL\n\nNOTA: En pacientes, que no pueden miccionar (sondados) se vuelve a colocar la sonda, y se hace la Rx de vaciado de vejiga NOTA: En pacientes con traumatismos pélvicos con sospecha de lesión uretral, si el paciente viene con un a sonda es importante no quitarla, haremos la prueba con una pequeña aguja de polipopileno situada al lado de la sonda, y hacemos presión en el glande para evistar el reflujo. Tampoco usaremos el sondage completo en pacientes con traumatismos o sospechas de lesiones uretrales.\n\nURETROCISTOGRAFÍA RETRÓGRADA Y MICCIONAL EN VARONES\nObjetivo: Estudio de la uretra y la vejiga.\nIndicaciones principales: Estenosis congénitgas y adquiridas, traumatismos con uretrorragia, anomalías congénitas, trastornos funcionales de la micción.\nContraindicaciones: Infección en período agudo (cistouretritis), obstrucción completa uretral (no forzamos el sondaje, puncionamos en la zona suprapúbica)\nPreparación: El paciente no tiene que hacer ninguna preparación, el día de la prueba antes de pasar al paciente revisamos su historia, le explicamos en qué consiste la prueba y la importacia de su colaboración, despues debe firmar un consentiemiento.\nEstudio: La prueba se hará en asepsia completa.\nMaterial: Contraste yodado iónico. (en pacientes con sospecha de de estenosis grave usaremos contraste no iónico)\nSuero fisiológico para diluir el contraste.\nLubricante urológico como anestésico tópico.\nCampo estéril completo\nSondas foley o pinzas especiales para uretrografía.\n\nSecuencia de imágenes:\n1. Abdómen simple ( si tiene una rx reciente, la podemos sustituir por una localiza de pélvis)\n2. Uretrografía: 1.Usamos una s.foley purgada con contraste\n2.Se aplica lubricante urológico en la punta i se introduce aprox 2.5cm . Llenamos el globo de la sonda con 2-3ml de solución salina para fijarla en la fosa navicular de la uretra.\n3.Con una jeringa de 50ml, introducimos el contraste a una velocidad constante. (Es importante que se traccione el pene para evitar acotaduras de la uretra que simulen o enmascaren lesione. Rellenaremos la vejiga a traves de la misma sonda, siempre con presión suave y mantenida para lograr relajar el esfínter.\n1. Hacemos 2-3 rx durante el proceso de inyección de contraste.\n2. Cistografía: Despues de rellenar adecuadamente la vejiga 250-300ml se realizan proyecciones AP OPD y OPI a 45º. y se retira la sonda.\n3. Uretrografía anterógrada: Hacemos dos Rx en OPD durante la micción, para poder valorar mejor la uretra posterior en replección. Cuando el paciente no consigue miccionar en decúbito, podemos realizar el estudio en BIPE.\n1. Para acabar, se hace una rx post miccional para valorar la presencia de residuo.\n\nNOTA:\n⟶ Si al hacer la exploración el paciente no consigue miccionar, o presenta mucho residuo post miccional, el urólogo valorará sondar al paciente.\n⟶ Si en algun momento de la exploración se detecta reflujo vesiculouretral, haremos una Rx de ABD, incluyendo riñones.\n⟶ En pacientes con estenosis grave de uretra, portadores de talla vesical, despues de la uretrografía retrograda, rellenaremos la vejiga a través de la talla y finalmente haremos el estudio permiccional\n\nPIELOGRAFÍA RETRÓGRADA O ASCENDENTE\nObjetivo: Estudio seriado retrógrado del sistema pielocalicial y del uréter en casos de uropatía obstructiva. Éste estudio se puede hacer en Quir.mediante canalización por cistoscópia por parte del urólogo.\no en una sala de Rx, donde el paciente acudirá ya con la S.Foley puesta y fijado en el extremo externo del catéter uretral, cuyo extremo interno se encuentra en el sistema excretor habitualmente en sist. pielocalicial.\nMateriales: Contraste yodado iónico o no. diluido al 30% con suero fisiológico para evitar enmascarar litiasis. Antes de introducir el contraste advertimos al paciente que si siente dolor, nos avise para poder detener la exploración.\nSecuencia de imágenes:\n1. Abdómen simple\n2. Rellenamos la zona superior del sist. excretor haciendo escopia mientras se introduce el contraste por el extremo inferior externo, del catéter ureteral. Hasta llenar sin distender, el sist. pielocalicial y el uréter superior.\nuna vez revisada la zona superior, si no hay afección, retiramos el catéter unos 15cm inyectando contraste a medida que vamos retirando.\nFinalmente, se rellena el uréter distal hasta que llegue el contraste a la vejiga, retirando al mismo tiempo el catéter y posteriormente la sonda vesical.\nDurante el relleno, se van haciendo radiografias AP y oblicuas del sist. excretor para estudiar la repleción del sist.excretor superior y el uréter hasta ver el contraste en vejiga o la causa de la uropatía obstructiva.\n\nPIELOGRAFÍA ANTEROGRADA O DESCENDENTE\nObjetivo: Estudio seriado anterógrado del sistema pielocalicial y del uréter inyectando el contraste a través del catéter de nefrostomía. Cuando hay una obstrucción del riñón, en ocasiones es necesario colocar un catéter de drenaje por vía percutánea con ayuda de escopia o eco para que la orina pueda eliminarse.\nLas indicaciones de la pielografía por nefrostomía son la valoración correcta, colocación del catéter y la estimación del nivel y la causa de la obstrucción.\nMateriales: Contraste yodado iónico o no. diluido al 30%\nSecuencia de imágenes:\n1. Abdómen simple\n2. Introducción del contraste mediante el catéter de nefro. Durante la inyección hay que advertir al paciente que avise si tiene molestia o dolor. Iremos haciendo imágenes en AP y oblicuas.\n3. Si el estado del paciente lo permite, se puede hacer una exploración en decçubito prono, que facilita la rápida detección del punto de obstrucción.\n\nILEOGRAFÍA\nObjetivo: Esta exploración se solicita en pacientes a los que se les ha extirpado la vejiga y se ha realizado una nueva, interponiendo una asa del íleon entre los uréteres y la pared abdominal.\nAntes de introducir el contraste, se realiza una RX simple de abd.\nPonemos la S. Foley gruesa hinchando bien el globo, sobre el orificio externo de la ileostomía y se introduce el contraste yodado iónico o no diluido al 30%, hasta rellenar el asa instetinal interpuesta.\nDependidendo de la técnica quirúrgica empleada, podremos rellenar los uréteres y el sist. pielocalicial. La inyección de contraste se hará bajo control de escópia.`,
29:`TEMA 29. HISTEROSALPINGOGRAFIA\n\nObjetivo: Permite la evaluación del útero y las trompas de falopio tras introducir contraste radiopaco a través del canal cervical. Es una técnica fundamental en el estudio de infertilidad femenina, para el estudio morfológico y funcional de las trompas de falopio.\n\nAunque se le atribuye cierto efecto terapéutico, es un procedimiento con finalidad diagnóstica.\n\nIndicaciones: Estudio de infertilidad\nEstudio de abortos de repetición.\nEstudio de malformaciones uterinas congénitas.\nValoración de la efectividad de métodos anticonceptivos como la ligadura de trompas o dispositivos intratubáricos.\n\nContraindicaciones: Posible embarazo\nEnfermedad pélvica inflamatoria activa o sangrado uterino activo.\nAlergia grave a los contrastes yodados (aunque se puede administrar una pauta de premedicación)\n\nRequisitos previos: No es necesaria una preparación especial, aunque es aconsejable la administración de un antiinflamatorio no esteroideo 1h antes de la prueba.\n\nCitación: Es importante realizar la prueba en la fase folicular del ciclo para tener un endometrio fino, para que sea más fácil la interpretación de las imágenes, ideal es entre el 7º y 12º día (contando a partir del primer día de la menstruación).\n\nMaterial: ⟶ Solución antiséptica (povidona yodada o clarhexidina)\n⟶ Catéter puede ser S. Floey o Sistema de vacío desechable.\n⟶ Contraste yodado hidrosoluble 5-10ml de baja osmolaridad.\n⟶ Espéculo\n⟶ Pinzas pozzi para traccionar el cérvix si es necesario.\n⟶ Medicación espasmolítica (buscapina 10mg).\n\nTécnica: Tumbamos a la paciente en posición ginecológica y hacemos una RX de PELVIS.\nLimpiamos la zona genital externa y localizamos el cuello uterino mediante tacto vaginal y se coloca el espéculo.\nDespués de purgar la sonda, se introduce por el orificio cervical externo. (si es necesario usamos las pinzas para ponerla).\nRellenamos el balón con aire, y retiramos el espéculo.\nEmpezamos a introducir el contraste a baja presión y controlando por fluoroscopio, generalmente son suficientes 5-10 ml.\n\nSecuencia de imágenes:\nSe obtienen 4 proyecciones básicas:\n1. Postcontraste inicial, con ella podremos ver los defectos de repleción o alteraciones del controno uterino.\n2. Postcontraste con distensión completa de la cavidad.\n3. Visualización de ambos conductos tubáricos.\n4. Paso del contraste a la cavidad peritoneal en cantidad suficiente por ambas trompas.\n5. Una vez obtenidas las imágenes, se retira el catéter y se realiza una rx postevacuación para comprobar la distribución libre del contraste en la cavidad peritoneal.\n\nNota: Pueden ser necesarias proyecciones complementarias como:\n1. Con tracción del cuello, en casos de marcada anteflexión o retroreflexión\n2. Proyecciones oblicuas para desplegar el trayeco tubárico.\n3. En decúbito lateral o prono en caso de no opacificarse una o ambas trompas.`,
30:`FÓRMULA Y NOMENCLATURA DENTALES\n\nEn el ser humano existen dos denticiones:\n\n⟶ DENTICIÓN DECIDUA *(dientes de leche)*: Constituida por 20 piezas : 8 incisivos\nDivididos en dos arcadas sup/inf. 4 caninos\nEmpieza sobre los 6meses con los incisivos inf y termina a los 6 años. 8 premolares.\n\n⟶ DENTICIÓN PERMANENTE: Constituida por 32 piezas: 8 incisivos\nComienza a los 6 años y termina con la aparición de los terceros molares “cordales” o muelas del juicio 4 caninos 8 premolares 12 molares\n\nNOMENCLARUTAS DE USO MÁS COMUN ⟶ Nomenclatura por cuadrantes de Palmer\n⟶ Nomenclatura de la American Dental Association\n⟶ Nomenclatura de la Feredación Dental Internacional\n\nTEMA 30. RADIOLOGÍA CONVENCIONAL DENTAL\n\nINTRODUCCIÓN\nLos dientes son pequeños órganos, duros, de color blanco amarillento que se disponen en forma de arco en ambos maxilares donde están incrustados en unas cavidades llamadas alveolos.\n\nTienen 3 funciones: ⟶ Digestiva: al realizar la masticación, los incisivos cortan, los caninos desgarran y premolares y molares trituran.\n⟶ Fonética: es una función pasiva, dan apoyo a la lengua y los labios para facilitar la pronunciación.\n⟶ Estética: gran parte de la estructura facial está condicionada por el soporte de los dientes a labios y mejillas. la falta de piezas (edentulismo) altera de manera significativa la morfología facial.\n\nTERMINOLOGIA: En odontología hay una “gerga” que todo técnico debe conocer para realizar correctamente las técnicas de rad. dental\n⟶ Mesial: Es aquello que se ACERCA al plano sagital medio\n⟶ Distal: Es aquello que se ALEJA del plano sagital medio\n⟶ Vestibular/labial/bucal: Es la cara del diente que mira hacia FUERA, “hacia el vestíbulo de la boca”.\n⟶ Lingual: Es la cara del diente que mira hacia DENTRO, “lo que toca la lengua” se usa para la arcada inferior\n⟶ Palatino: Es la cara del diente que mira hacia DENTRO, “lo que mira al paladar” se usa para la arcada superior.\n⟶ Planos Oclusales: Son los que pasan por la superficie masticatoria de las dos arcadas.\n⟶ Oclusal superior: discurre 4cm por debajo de una línea que une el trago y el ala de la nariz\n⟶ Oclusal inferior: Para 2cm por debajo de la línea que une el trago y la comisura labial cuando la boca está muy abierta.\n\nTÉCNICAS CONVENCIONALES DE RAD. DENTAL\nÉstas técnicas se dividen en Intraorales y Extraorales, según la placa o el detector digital se sitúe dentro o fuera de la boca\n\nINTRAORALES\nIncluyen: ⟶ Aleta de mordida (proyección bucolingual de las coronas y las crestas alveolares de los dientes tanto superiores como inferiores. Se usan para el estudio de caries o alteraciones de la pulpa.)\n⟶ Rx Periapicales (proyección bucolingual de los dientes, de la membrana periodontal y del hueso circundante. Con ésta técnica los dientes se estudian por separado, la angulación del tubo variará en función de la pieza que se estudia usando de referencia los planos oclusales. Para incisivos y caninos la placa irá vertical, para premolares y molares en horizontal.)\nHay dos técnicas para ésta proyección 1. Técnica de la bisectriz del ángulo 2. Técnica del paralelismo\n⟶ Rx Oclusales (proyección intraoral que se caracteriza por situar la placa en el plano oclusal superior en el caso de las oclusales maxilares, o en el plano oclusal inferior en las oclusales mandibulares. (ESTÁ EN DESUSO PRACTICAMENTE).\n\nHoy en día las suelen hacer los odontólogos con tubos de RX incorporados al sillón. Usando placas especiales envueltas en plástico a prueba de humedad, aunque lo que más se utiliza la técnica digital con detectores intraorales.\nEs importante la protección radiológica por la escasa DFP, se suelen usar conos delimitadores de haz con un diámetro externo de 6cm, las placas las mantiene en posición el propio paciente con un dedo o unas pinzas.\nBisectriz del ángulo\nParalelísmo\n\nEXTRAORALES\nIncluyen: ⟶ Rx Oblicua Lateral (técnica en desuso, gracias a la ortopanto). Se hacían Rx de las piezas desde el canino hasta el tercer molar. era una proyección directa (sin parrilla) en la que el borde del chasis queda alineado con nariz, labios y mentón. La cabeza rota hacie el lado de estudio para desenfilar la rama mandibular contralateral, y levantar el mentón para aumentar la ventana radiológica entre rama y cevicales.\n⟶ Teleradiografía lateral de cara y cráneo (cefalometría): Junto con la ortopanto son las exploraciónes básicas en odontología y en el estudio de patologías maxilofaciales. Es una proyección de las estructuras óseas del macizo facial y de las partes blandas de la cara. Se usa para el estudio de ortodoncia, tanto para el diagnóstico como para la planificación\n⟶ Rx Ortopantomografía proyección muy usada, por facilidad, rapidez y baja dosis y que en una sola imagen se pueden ver las dos arcadas enteras y los tejidos de soporte\n⟶ TAC DENTAL se usa para implantes dentales, para planificación de precirugía, ya que permite estudiar la situación de las estructuras neurovasculares y la calidad del hueso, así como lesiones en el hueso. Evita superposiciones, tiene mayor resolución de contraste y permite reconstrucciones multiplanares en 2d y 3d. Éstos estudios se pueden realizar con TC Helicoidal o Tc de haz cónico`,
31:`TEMA 31. RADIOLOGÍA CONVENCIONAL EN PORTÁTIL, UCI Y QUIRÓFANO\n\nLos chasis, sean digitales o convencionales, se cubriran con una bolsa de plástico u otro tipo de cubierta para que no entren en contacto directo con el paciente por cuestiones de higiene y manipulación\n\nPROTECCIÓN RADIOLÓGICA:\n1. Delantal plomado\n2. Protección gonadal a paciente si es posible\n3. 2m de distacia técnico-tubo al disparar\n4. Avisar de viva voz que se va a disparar\n5. No se dispara hasta que no se “haya ido todo el mundo”.\n\nPROYECCIONES RADIOLÓGICAS:\nTX PORTÁTIL: Se hace en AP y en decúbito supino la mayoría de las veces. Según la situación del paciente debemos intentar hacerla en sedestación para “mejorar” el diagnóstico y evitar las diferencias morfológicas. Es la prueba sujeta a mayor variablididad de calidad de la imagen.\nEl foco debemos intentar que esté a la mayor distancia posible. (180cm si es posible)\nRetirar en la medida de lo posible cables y dispositivos externos. Intentar adquirir la imagen en inspiración profunda del paciente.\n\nABD PORTÁTIL: Se adquiere en AP y decúbito supino, teniendo en cuenta: colocar soporte en rodillas para relajar musculatura, brazos fuera del campo, procurar que esté centrado y sin rotaciones, adquisición un par de segundos después de terminar la espiración, para que el diafragma esté es su posición más elevada y por supuesto debemos incluir todo el abdomen\n\nPROYEECIONES COMPLEMENTARIAS:\n⟶ Tx lateral en inspiración (derrame pleural)\n⟶ Tx lateral en espiración (neumotórax)\n⟶ Abd lateral (neumoperitoneo)\n⟶ Abd supino y rayo lateral (neumoperitoneo en paciente no movilizable)\n\nRX ESQUELÉTICAS\nPara poder realizar los mivimientos necesarios, el arco está provisto de sistemas de sujeción “en todos los planos”. El ajuste de los parámetros se hace habitualmente con un sist. automático que regula la tasa de dosis a la entrada del paciente. Los equipos más nuevos, tiene la opción de fluoroscopia pulsada, en la que la radiación se activa y desactiva en cortos intervalos de tiempo durante la exposición, con ello podemos reducir la dosis.\nTambién permiten magnificar la imagen, ya sea con zoom (no augmenta dosis a paciente) o por magnificación en el intensificador de imagen (aumentando la radiación al paciente.)\n\nPROTECCIÓN RADIOLÓGICA:\n1. Exigible delantal y protección tiroidea plomada para todo el personal (en algunos casos también usaremos guantes y gafas plomados)\n2. Restringir el uso de radioscopia.\n3. El arco siempre por debajo del paciente (si es posible)\n4. El intensificador de imagen lo más próximo al paciente que sea posible.\n5. Usar siempre fluoroscopia pulsada sin magnificación.\n6. Colimar al máximo al área de interés.\n7. Evitar la manipulación del paciente durante el disparo\n8. OJO con las oblicuas! alejarse más del tubo.\n9. Reducir al máximo el nº de placas.\n\nTRABAJO EN QUIRÓFANO:\nEl técnico de radiología es personal no estéril, se tendrá que mover con cuidado para no contaminar zonas estériles. Deberá ir vestido con ropa adecuada para el entorno quirúrgico y llevar el delantal plomado y las protecciones necesarias. En cuanto a la adquisición de imágenes, deberá procurar que el cirujano tenga una visión perfecta de los monitores y que el arco no interfiera la movilidad del personal de quirófano, velando por la radioprotección de todo el personal.`,
32:`TEMA 32. RADIOLOGÍA PEDIÁTRICA\n\nINTRODUCCIÓN\nLa radiología pediátrica se encarga de todas las técnicas desde la época prenatal hasta la edad adulta. Es necesario adaptar las técnicas de imagen, minimizando dosis, eligiendo medios de contraste más apropiados para cada prueba y edad, y también es conveniente cuidar el entorno y que el técnico desarrolle aptitudes y habilidades para el manejo de los niños.\n\nÉstas guias son una herramienta para ayudar al técnico a realizar adecuadamente las pruebas radiológicas, la decisión final de cada procedimiento la tiene el médico/radiólogo resposable.\n\nLos protocolos de examen tienen ue tener en cuenta la edad y la constitución del paciente, las herramientas de reducción de dosis de las que disponga la máquina deben estar activadas, empleando la colimación apropiada para limitar la exposición al área de interés. Con niños también emplearemos métodos de inmovilización apropiados a veces la conlaboración de un familiar puede facilitar la cooperación del paciente.\n\nPara adolescentes de gran tamañó, se utilizarán protocolos parecidos a los de los adultos, aunque sin olvidarse de las protecciones gonadales, oculares o tiroideos cuando sea posible usarlos para que no interfieran con la región de estudio.\n\nLos portátiles de neonatos, deben ser capaces de usar kV y mAs adecuados para obtener rx de calidad, en tiempos de exposición aceptables y maximizar las medidas de protección tanto del paciente como de los pacientes adyacentes.\n\nRX DE TÓRAX\nEn recién nacidos, lactantes y niños mayores, la dosis de radiación de una placa en PA o AP, tiene que oscilar entre 0.05 y 0.3 mGy.\nEl Kilovoltaje debería oscilar entre 60Kv (para niños pequeños) y 150kV (para niños de tamaño adulto)\nEn cuanto a los milis intentaremos que los tiempos sean lo más reducidos posible para evitar artefactos por movimiento.\nLa DFP mayor de 182cm para reducir la magnificación (aunque se podrá llegar a 1m, si fuera necesario)\nEl foco no excederá los 2mm (rango recomendado 0.6-1.2mm)\n\nPROCEDIMIENTOS CON FLUORSOCOPIA.\nGENERALIDADES\nLa adquisición de imágenes radiográficas debe limitarse única y exclusivamente a cuando sea esencial para el diagnóstico o el procedimiento de una imagen de mayor calidad. Una imágen preliminar del área que se va a explorar, antes de la administración del contraste, puede ser útil en niños con:\n⟶ abdómen agudo\n⟶ valorar la existencia de calcificaciones\n⟶ anomalías esqueléticas y de “situs”\n⟶ patrón de aireación intestinal\n⟶ neumoperitoneo\n⟶ evidencia de cirugías previas\n⟶ catéteres y electrodos de monitorización.\n\nUn rayo horizontal debe realizarse si el paciente presenta alguna condición que predisponga a una perforación esofágica, gástrica o intestinal.\n\nEl uso de fuentes de calor/infrarojos posibilita realizar estudios fluoroscópicos largos a neonatos, especialmente si son prematuros e inmaduros, no son capaces de termorregularse debido a que presentan un descenso de la grasa subcutánea.\n\nESPECIFICACIONES TÉCNICAS\nHay que realizar las pruebas sólo con intensificación fluoroscópica de la imagen o con receptores de imagen de panel plano de estado sólido y con equipo radiográfico.\nEl equipo debe proporcionar imágenes de calidad diagnóstica y debe tener capacidad de realizar fluoroscópia pulsada y grabaciones. Además debe disponer de las herramientas necesarias para comprimir y aislar regiones accesibles del intestino.\nLas instalaciones deben tener la capacidad de suministrar:\n⟶ oxígeno suplementario\n⟶ aspirar cavidad oral\n⟶ tracto respiratorio superior\n⟶ responder a cualquier emergencia que pueda poner en peligro la vida.\nAdemás disponer de un equipo de reanimación adecuado a cualquier tipo de paciente desde recién nacido prematuro a un adulto.\n\nMEDIOS DE CONTRASTE GASTROINTESTINALES EN PEDIATRÍA\nEl tipo y la cantidad de contraste están determinados por la edad del niño y el motivo de la exploración.\nEl medio de contraste para uso gastrointestinal más usado en niños es el bario, puede administrarse por: ⟶ V. Oral ⟶ V. Rectal ⟶ Ostomía ⟶ Catéter.\nEstá contraindicado si se sospecha o hay una perforación del tracto gastrointestinal, en estos casos es preferible usar contrastes yodados hidrosolubles.\nEn cuanto a elegir el contraste yodado, tendremos en cuenta la osmolaridad, ya que los contrastes hiperosmolares pueden causar trascase de líquido entre la pared y la luz intestinal y una vez ansorbidos, entre los tejidos blandos extravasculares y los vasos sanguíneos.\nNeonatos y niños mayores con alteraciones de la función renal y cardíaca son más susceptibles a estas alteraciones electrolíticas, con ellos deben usarse contastes isoosmolares para el estudio del tracto gastrointestinal superior.\nEn cuanto al uso de V. Rectal, pueden usarse contrastes hiperosmolares siempre y cuando se diluyan hasta alcanzar una baja osmolaridad. Los contrastes de alta osmolaridad, sólo están indicados en casos específicos, como el tratamiento de íleo meconial.\nLos contrastes hiperosmolares (gastrografin), también deben evitarse en niños con riesgo de aspiración, ya que pueden causar trasvase de líquido a nivel alveolar y producir neumonitis química con el consiguiente edema pulmonar.\nEl contraste se administrará de forma apropiada según edad y estado del paciente, a los neonatos y niños pequeños se les puede administrar con biberon, a los más mayores se les hará beber directamente.\nEn pacientes con SNG, gastrostomía, o sonfda yeyunal, se introducirá en contraste através de éstos. Si un paciente de cualquier edad no toma suficiente contraste vía oral, hay que valorar si es necesario colocar una sonda entérica para su administración.\n\nESOFAGOGRAMA Y TRACTO GASTROINTESTINAL SUPERIOR\nESOFAGOGRAMA: Se deben evaluar la anatomía y la motilidad del esógafo mediante proyecciones Ap y lateral. Debemos ver desde nasofaringe hasta el fundus gástrico.\n\nTRACTO GASTROINTESTINAL SUPERIOR (CONTRASATE SIMPLE): Se evalua la deglución, la anatomía y la motilidad de todo el esófago, estómago y duodeno. Hay que observar directamente el paso inicial de contraste a través del duodeno para confirmar la posición de la unión duodeno-yeyunal. Debe registrarse la posición de la unión duodeno-yeyunal en ambas proyecciones frontal y lateral, para diagnosticar o excluir.\nNo se recomienda tratar de provocar el reflujo ni aumentar el tiempo de escopia para su detección. El estudio debe incluir una imagen final que documente el vaciado gástrico y el progreso de contraste a través de las asas del intestino delgado.\n\nINTESTINO DELGADO: En determinadas circunstancias y para determinadas indicaciones, existe la opción de estudiar el intestino delgado con RM (enteroresonancia magnética) que no implica radiación ni anestesia.\nCon frecuencia se usa como contraste una suspensión de sulfato de bario al 45% de peso/volumen, el volumen varía en función del tamaño del paciente, de su anatomía y patología. 30-75mL en niños pequeños y 480mL en adolescentes.\nCuando se sospecha una enfermedad focal del intestino delgado, se recomienda el empleo intermitente de la fluoroscopia con compresión para evaluar todas las asas del intestino delgado accesibles, incluyendo en íleon terminal. El tiempo de escopia para evaluar la progresión del contraste debe ser individualizado en función de la velocidad del tránsito intestinal. Las imágenes suelen obternerse 15',30' y 1h después de la administración del contraste, el estudio puede finalizarse cuando el contraste llegue a una ostomía, un punto de obstrucción completa o se demuestre una perforación y otro hallazgo que requiera intervención quirúrgica.\n\nENEMA\nConsiste en una exploración del colon mediante enema de contraste guiado por fluoroscopia. Las contraindicaciones de ésta técnica incluyen evidencia de perforación del colon, colon isquémico, megacolon tóxico, shock hipervolémico, peritonitis y otra condición clínica del paciente que conlleve inestabilidad.\n\nENEMA DIAGÓSTICO CONVENCIONAL: No necesita preparación específica en la mayoría de los paciente, se usa sonda rectal pequeña que permita el adecuado flujo de contraste, no es necesario usar sondas con globo, pero si se usan y se pretende inflar, se hace bajo en control de escopia. En los recién naciedos se prefieren los medios de contraste hidrosolubles isoosmolares debido al riesgo de perforación intestinal.\nSe debe administrar un volumen suficiente de contraste rectal para distender el colon correctamente. El relleno completo de todo el colon en niños con anatomía normal, se confirma por el reflujo del contraste al intestino delgado, el llenado del apéndice o la indentificación concluyente de la válvulo ileocecal. Es preferible emplear una técnica de alto kV, en cuanto a las imágenes que se obtienen del recto deben ser en proyección lateral y documentar la posición del ciego, también puede ser útil obtener imágenes postvaciado, y , si son necesarias, imégenes tardías pos evacuación.\n\nINVAGINACIÓN INTESTINAL: La eco es la técnica para el diagnóstico de las invaginaciones intestinales (afección grave donde una parte del intestino se introduce en otra adyacente, similar a un telescopio. Esto obstruye el flujo sanguíneo y de alimentos, causando dolor abdominal severo e intermitente, vómitos y heces sanguinolentas. Requiere atención médica urgente) La eco permite reducirla guiada por un enema de suero, lo que evita el uso de radiaciones ionizantes.\n\nENFERMEDAD DE HIRSCHSPRUNG: Los contrastes más comunes son el bario o los hidrosolubles, en neonatos o bebés son preferibles los hidrosolubles diluidos, el recto debe ser cateterizado con una sonda blanda ¡¡ sin llenar el globo !! , con la punta justo en el interior del recto, sin introducirla demasiado. El calibre del catéter deber ser el más pequeño posible. El exámen se realiza con fluoroscopia variando la posición del paciente para ver correctamente la zona de transición, las primeras imágenes deben mostrar el llenado de contraste del recto y el sigma, tenemos que ver tanto el llenado como la distensión completa, tomando una imagen y después de la retirada del cateter se obtiene la imagen de postevacuación.\n\nÍLEO MECONIAL DEL NEONATO: La evaluación radiológica debe preceder al intento de tratamiento no quirúrgico del íleo meconial no complicado. La contraindicación más importante es la evidencia clínica de íleo complicado, como perforaciones o pseudoquistes.\nPara realizar el enema, normalmente se usa contraste hidrosoluble casi isotónico, si con esta explocación se puede diagnosticar, se puede proceder a realizar un enema de contraste terapéutico, para hacerlo, se coloca un cateter de tamaño apropiado, se infunde el contraste controlando con el fluoroscopio, preferiblemente dejar que entre por gravedad, la duración y el número de intentos y el intervalo, lo decide el médico. En general, los intentos en enema terapéutico para eliminar el meconio y la descompresión son útiles siempre y cuando el niño esté estable. Una vez terminado el procedimineto, hay que obterner imágnes para confirmar la liberación de la obstrucción y para detectar precozmente signos de perforación.\n\nCISTOURETROGRAFÍA MICCIONAL SERIADA\nEs un estudio del tracto urinario inferior, que se ha sustituido por exploraciones con ecografía.\nSe requiere cateterización aséptica de la vejiga, contraste yodado, y observación con flurosocópia y grabación de las imágenes obtenidas de las estructuras opacificadas.\nEl objetivo es evaluar la vejiga, la uretra, la antomía postoperatoria y la micción, con el fin de determinar la presencia o ausencia de anomalías vesicales y uretrales, incluido el reflujo vesicouretral.\nNo hay contraindicaciones absolutas, pero tendremos en cuenta los antecedentes personales de reaccion previa importante a medios de contraste yodado. Si no se dispone de una imagen abdominal previa, se obtendrá una antes de infundir el contraste, y posteriormente se introduce el cateter en la vejiga.\nEn niños varones, se puede instalar retrógrada y asépticamente un anestésico tópico en la uretra, siendo preferible usar catéteres sin globo.\nTamaños de cateter recomendables: ⟶ En los recién nacidos, (5 French) ⟶ En niños más mayores (8 French) ⟶ En niños adolescentes ( > a 8 French)\nEn pacientes con fimosis, no es necesario retirar por completo el prepucio para la cateterización, en niñas, el catéter puede asegurarse con un esparadrapo en el muslo o el periné. Después de la colocación de la sonda, la vejiga debe vaciarse antes de la instalación del contraste, en la que se recomienda la administración por goteo y gravedad.\nLa capacidad vesical de los menores de 1 año, puede estimarse multiplicando el peso del paciente en Kg por 7, y en niños de 1 a 12 años, multiplicando la edad del paciente en años +2*30.\nSi se ha realizado una IQ reciente de vejiga, la infusión del contraste por gravedad debe hacerse con el recipiente del contraste tan abajo como sea posible, pero por encima de la altura de la mesa para asegurar el llenado de la vejiga a baja presión. Una capura precoz de la vejiga tras la administración de una pequeña cantidad de contraste puede revelar uin ureterocele intravesical u otro tipo de masa. Después debe llenarse la vejiga hasta su máxima capacidad o hasta que el paciente orine.\nEn paciente menores de 1 año llenar ciclicamente la vejiga (llenar-vaciar, llenar-vaciar..) puede ser útil, ya que vacían a bajos volúmenes y con esto se incrementa la posibilidad de detectar reflijo en pacientes con alto riesgo de tenerlo.\nLa posición del paciente es clave en cada fase:\n⟶ Varones (pequeños): deben colocarse en posición oblicua durante el estudio miccional, sin superposición de las caderas, es preferible obtener las imágenes con el catéter retirado.\n⟶ Varones (mayores): el inicio de la micción puede ser más fácil con la mesa oblicuada 30-45º o con el paciente en bipe.\n⟶ Femeninas: Se estudian el Ap, y no es necesario retirar el catéter\nDespués del estudio miccional obtendremos inmediatamente una imagen de las fosas renales, para registrar la presencia o ausencia y grado de reflujo. Si se indentifican signos de obstrucción, se deben obtener imágenes tardías para calcular el tiempo de vaciado pielocalicial y del uréter.\n\nESCOLIOSIS\nEs la alteración de la alineación de la columna vertebral, la telerradiografía de columna total el bipe es una técnica útil para confirmar la presencia de escoliosis, medir el grado de curvatura y definir el tipo. Consiste en una proyección lateral posteroanterior (- la dosis de radiación a tiroides y mamas), y una proyección lateral posibilita el estudio de cifosis, lordosis y espondilolistesis. El paciente dene permanecer de pie, con las rodillas juntas y extendidas, en la posición lateral los brazos deben colocarse rectos delande del paciente (mejora la visibilidad de la escoliosis, mejor que colocarlos encima de la cabeza).\nEl estudio debe incluir toda la columna desde los ángulos mandibulares hasta los trocánteres mayores, en el estudio inicial también se valoran la caja torácica y la pelvis, en los estudios de seguimiento, se debe estudiar sólo la columna, por tanto colimaremos tanto como sea posible para reducir dosis a paciente.\nLos pacientes que no pueden estar de pie, se realiza la prueba en supino, reduciendo la DFP.\n\nPREOPS: se incluyen proyecciones frontales con flexión de la columna, también incluyen la prueba de BENDING (estudio de flexibilidad de las desviaciones de la columna en plano coronal) se hacen con el paciente en decúbito, con la pelvis fijada y movilizando al máximo la columna dorsolumbar, de forma voluntaria. De esta manera, la curva que no se normaliza, significa que es una curva estructurada que, por tanto, debe ser tratada. Si la curva se normaliza con el estudio, es una curva no estructurada, si no compensadora (es un intento del cuerpo de recuperar el balance coronal).\n\nESQUELETO APENDICULAR\nHúmero AP\nAntebrazos AP\nManos PA\nFémures AP\nPiernas AP\nPies AP\n\nESQUELETO AXIAL\nTóraz (Ap, Lat y Obl) para incluir costillas y columna dorsolumbar\nPélvis AP para incluir lumbar inferior\nLumbosacra LAT\nCervical LAT\nCráneo AP y LAT\n\nSERIE ÓSEA\nConjunto de varias RX que engloban el estudio de todo el esqueleto, una indicación habitual es la sospecha de maltrato, displasias esqueléticas, síndromes, alteraciones metabólicas y algunas neoplasias. El objetivo es identificar anomalías focales o difusas del esqueleto y diferenciar variantes anatómicas de la normalidad de situaciones patológicas. El protocolo varía dependiento de la orientación clinica del estudio.\n\nESTUDIO DE SOSPECHA DE MALTRATO O CONFIRMADO\nHay que estudiar cada zona por separado, para no perder calidad de imagen nunca realizaremos “babygram”. Necesitamos al menos, un frente de cada extremidad, las axiales se pueden hacer en dos proyecciones, también necesitamos proyecciones adicionales oblicuas de tórax y si se considera necesaria una Towne y laterales de algunas articulaciones.\nEn algunos protocolos si existe una alta sospecha de maltrato, se recomienda repetir el estudio en 1 semana.\n\nDISPLASIAS ESQUELÉTICAS Y SÍNDROMES\nSe hace el procolo habitual, excepto en los siguientes supuestos:\n⟶ Si la talla del niño lo permite, se puede obtener una imagen con los brazos y las piernas enteras. En recién naciedos y niños pequeños, se puede hacer babygram, pero con las proyecciones de cabeza, manos y pies por separado, las laterales de algunas articulaciones pueden ser útiles en casos concretos.\n⟶ Las regiones estudiadas y las proyecciones pueden depender del diagnóstico diferencial considerado.\n\nALTERACIONES METABÓLICAS\nNormalmente no es necesaria la serie completa, y se recomienda realizar el estudio sólo de las zonas de interés.\n\nNEOPLASIAS\nSe pueden solicitar proyecciones adicionales ortogonales.\n\nCONSIDERACIONES TÉCNICAS\nEn los niños mayores, se usa un sistema de velocidad media y una parrilla móvil para las regiones más largas, siempre usaremos la técnica de bajo kV, para obtener un adecuado contraste, el rango con el que trabajamos es de 55-70kV para esqueleto apendicular, cabeza y columna. Los milis se ajustan al kV, y la DFP de 101,6cm. Con los sistemas digitales deben tener una altra resolución espacial y presentar características óptimas y eficientes de dosis de radiación.`,
33:`TEMA 33. ESTUDIO RADIOLÓGICO DE LA MAMA, MX Y GALACTO\n\nEl objetivo de la mamografóa, es obtener imágenes de alta resolución y con buen contraste de la estuctura interna de la mama, que permita detectar la patología de la mama, aunque sean tan sutilues como las microcalcificaciones en el carcinoma de mama.\n\nANATOMIA\nLa mama está situada en la cara anterior del tórax sobre el pectoral mayor y se extiende desde la segunda hasta la 7ª costilla, la piel tiene un grosor de entre 0.5 y 2 mm y justo debajo se sitúa la fascia superficial, que se divide en una capa superficial y otra profunda, envolviendo la mama. La capa profunda forma la fascia retromamaria y está en contacto con la fascia del pectoral, permitiendo que la mama tenga algo de movimiento, y posibilitando que los vasos sanguíneos y linfáticos la atraviesen.\n\nLa mama está dividida en compartimentos incompletos por tejido conectivo, descrito por Cooper hace 150 años y conocidos por “ligamentos de Cooper”, éstos formar una especie de picos que se unen a la piel y forman el “retinacula cutis”.\n\nPor debajo de la piel está la grasa subcutánea, que en algunas mujeres está separada del cono de parénquima de la mama y en otras no se distingue la grasa de las estructuras glandulares.\n\nLa superficie del pezón es irregular y en él se encuentran los orificios de los ductos, hay entre 8 y 20 conductos mayores que se abren en el pezón, y cada uno de ellos definen el segmento de la glándula. Los conductos mayores se dilatan en la porción ampular y después se ramifican, de forma que los ductos segmentarios profundos se dividen en estructuras subsegmentarias y éstas se ramifican hasta formar acinos (unidades funcionales y secretoras de la glándula mamaria, encargadas de sintetizar y almacenar la leche durante la lactancia.)\n\nLa mama sufre cambios involutivos con la edad, las células acinares de los lobulillos disminuyen, el tejido conectivo se hace fibrótico... Ésta involución probablemente comienza en la tercera o cuarta década y está bastante avanzada en la menopausia.\n\nNOMENCLATURA\nEs la terminilogía usada en mamo para identificar y localizar las lesiones, el sistema más usado es el de los cuadrantes, dividiendo la mama en 4 con el pezón como centro y referencia.\n\nTÉCNICA MX: La mamografía se hace en un equipo de RX, que consta de un generador de corriente, y una columna con un brazo giratorio que contiene el tubo de rayos, un compresor y un receptos de imagen. El tubo tiene un ánodo de molibdeno o de rodio que ayudan a tener un buen contraste del tejido mamario y pequeños puntos focales de 0.3 y 0.1mm.\n\nUna MX de buena calidad es esencial disminuir la borrosidad haciendo una buena compresión de la mama, hay que usar parrilla antidifusora para evitar la radiación dispersa, disminuir el ruido (que depende de la calidad del haz de RX) y el grano de la película, también evitaremos artefactos que puedan estar en la piel o en la película.\n\nMX CONVENCIONAL: El detector consta de un portachasis con parrilla antidifusora, la película radiográfica es específica para mx, el chasis se mete en la reveladora y mediante el proceso químico obtenemos la placa.\n\nMX DIGITAL INDIRECTA: Es el mismo equipo, la diferencia la marca el chasis, la película tradicional se substituye por una lámina luminiscente fotoestimulable. El chasis se introduce en el digitalizador que convierte la información en impulsos eléctricos y la transmite a una matriz donde se “dibuja” la imagen digital de la mx.\n\nMX DIGITAL DIRECTA: Se hace igual, pero no usamos chasis ni película ni lámina. El detector está alojado justo debajo de la mama que recibe la radiación una vez atravesada. Hay dos tipos de detectores, el fósforo-silicio amorfo o el selenio amorfo.\n\nTOMOSÍNTESIS: Es el último avance en el diagnóstico mamográfico, es una técnica tridimensional basada en una modificación de la mx digital, el tubo hace un barrido obteniendo imágenes de dos y tres dimensiones en una sola comprasión, después podemos hacer reconstrucciones tridimensionales de 1mm de grosor.\n\nPROYECCIONES\nEs una exploración intimidante, por eso se debe explicar bien el procedimiento, haciendo hincapié en la importacia de la compresión e insistir que a mayor compresión mejor imagen y menor dosis.\n\nLas ventajas de una buena compresión son: 1. Reducción de dosis\n2. Evitar el incremento de dosis acortando el T de exposición.\n3. Facilita el diagnóstico\n4. Mejora la resolución espacial al disminuir las distancias entre los tejidos.\n5. Reducción de la borrosidad por movimiento.\n\n⟶ Es importante que las proyecciones sean simétricas (ya que una asimetría sutil puede ser indicativo de patología)\n⟶ Es preferible hacer la MX, durante la fase postmenstrual (mamas menos hinchadas y menos sensibles)\n⟶ La Mx se hace en BIPE como norma general (si viene una paciente en silla de ruedas, etc. Se hace sentada)\n⟶ Algunos procedimientos intervencionistas de hacen en decúbito (la mayoría, al menos en HUB)\n\nPROYECCIONESA DE RUTINA\nOML (oblicua medio lateral) el tubo se angula 45º, el pectoral mayor se ve cruzando la mitad superior de la placa\nCC (craneo caudal) El tubo se coloca con el rayo perpendicular al suelo, todo el tejido fibroglandular queda incluido en el estudio y puede verse una pequeña parte del pectoral en el borde posterior.\n\nCALIDAD TÉCNICA DE LA MX\nDeben tenerse en cuenta las siguientes consideraciones:\n⟶ Autoevaluación del técnico y revisión por el radiólogo de la calidad de la imagen para después hacer el diagnóstico\n⟶ Las mamas deben estar lo más simétricas posible y proyectar la mayor cantidad de tejido posible.\n⟶ El pezón debe quedar de perfil ( aunque no es algo necesario si con la “rotación” del pezón conseguimos ver más tejido)\n⟶ Las MX deben estár rotuladas el todas las proyecciones\n\nPROYECCIONES ADICIONALES\nCC exagerada lateralmente: para descartar sospecha de lesión en la mitad lateral de la mama. La paciente rotará un poco para que la mitad lateral de la mama se proyecte más y mejor.\n\nCola axilar (Cleopatra): Útil para separar la cola axilar y ver lesiones en el tejido de la cola mamaria, y para confirmar la posición de la lesión, es importante ver “solo” la cola, para poder hacerla rotaremos el tubo 20º para colocarlo paralelo a la cola\n\nProyección Valle: Útil para ver el tejido situado cerca del esternón, para hacerla se ponen las dos mamas encima del chasis, el técnico “empuja” a la paciente hacia delante, para ver la máxima proporción de tejido.\n\nProyección ML (90º): Es la 3ª proyección más usada, si una lesión se ve en la Oblicua pero no en la CC, se hace la lateral pura para ver si la lesión es real, o una superposición de los tejidos.\nSe usa básicamente cuando hay que colocar un arpón, en éste caso se necesitan dos proyecciones perpandiculares entre sí, si es necesario se pide a la paciente que retraiga la mama contralateral para evitar superposición.\n\nPoyección LM (90º): Si existe una lesión en los tejidos mediales de la mama, la imagen será más nítida si se emplea ésta proyección\n\nProyección modificada Caudo Craneal (al revés): Se usa sobretodo en mujeres con mucha cifosis, en mamas pequeñas y en varones\n\nMama masculina: Se realiza igual que la femenina con las mismas proyecciones estandar, modificando la craneo-caudal si es necesario.\n\nCompresión puntual y magnificación: Cuando se comprime la mama entera, el grado de compresión que se consigue, es de su porción menos comprimible. En ocasiones, el radiólogo necesita imágenes más focales. Usando una compresor más pequeño conseguimos comprimir en la zona que necesita el radiólogo, y si además quiere magnificar la zona, lo conseguimos separando la mama del detector. Esto nos ayuda a valorar mejor ciertas zonas que con la compresión estandar pueden dar luegar a sospecha de posibles lesiones. (Aunque ahora te piden una tomo, y ya no se suelen hacer las otras)\n\nPATOLOGÍAS DE LA MAMA:\nLa mamografía, es actualmente el mejor método de cribado poblacional. Se ha establecido una clasificación con los hallazgos de la MX, conocido como BIRADS (breast Imaging Resporting Data System) para estandarizar los resultados de la mx, unificar redultados de informes radiológicos y facilitar el análisis y la actitud terapéutica. Aunque hay que tener en cuenta que no todas las lesiones son “malas”.\n\nCC exagerada\nCleopatra\nValle\nLM (latero medial)--> el rayo incide por la axila y sale por el canalillo\nML(medio lateral)--> el rayo indice en canalillo y sale por axila\n\n⟶ Lesiones Benignas:\n1. Mastopatía fibroquistica y displasia mamaria: Estos términos se usan para definir una mama densa o con tejido fibroglandular augmentado.\n2. Fibroadenoma: Es la lesión sólida más frecuente de la mama, suele presentarse en mujeres jóvenes, son sensibles a los efectos hormonales, por lo que después de la menopausia “desaparecen”, aunque a veces se convierten en calcificaciones típicas.\n3. Quistes: Pueden encontrarse a cualquier edad, pero el pico de prevalencia se encuentra en mujeres de 30-50 años, pueden ser únicos, aunque normalmente son múltiples y suelen ser blandos, en imagen se ven como densidades redondeadas y con márgenes bien definidos.\n\n⟶ Lesiones Malignas:\nEl carcinoma de mama es el tipo de cáncer más frecuente en la mujer , actualmente el (10%) de la población femenina padecerá un cáncer de mama.\nEl tipo histológico de cáncer de mama más frecuente es el carcinoma ductal (90%), seguido del carcinoma lobulillar (5/10%) y por último la enfermedad de Paget (1-5%).\nLa mayoría de los estudios, indican que las mujeres con antecedentes familiares cercanos (madre/hermana.. ) tienen 14 veces más riesgo que el resto de la población.\nEn general son lesiones firmes y duras cuando son palpables y pueden estar ancladas a la piel o a las estructuras profundas de la pared torácica. En la MX, el cáncer de mama puede tener diferentes presentaciones, generalmente se ve una masa definida con márgenes espiculados o estrellados, un área de asimetría o microcalcificaciones sospechosas. Si están cerca del pezón, pueden llegar a retraerlo y si se dejan evolucionar, pueden llegar a erosionar la piel y formar masas ulceradas.\n\nPROTESIS MAMARIAS\nHay dos localizaciones respecto al tejido mamario en que pueden colocarse:\n⟶ Retroglandular ( el implante está dentrás del tejido mamario y delante del pectoral)\n⟶ Retropectoral (el implante se sitúa por detrás del músculo)\nPara hacer la MX, se usan las proyecciones estandar solo que aplicando la técnica Eklund, que básicamente es empujar la prótesis hacia atrás y “traccionar” el tejido mamario hacia delante.\n\nPROCEDIMIENTOS INTERVENCIONISTAS\n⟶ PAAF (Punción-aspiración con aguja fina) usada para pequeñas lesiones, permite obtener una muestra de células para un análisis citológico.\n⟶ BAG (Biopsia con Aguja Gruesa) Técnica de gran rendimiento diagnóstico ante cualquier tipo de lesión, con la que se obtienen diferentes cilindros de tejido.\nSe puede obtener por: ⟶ mamo (esterotáxia), basada en el cálculo de coordenadas de la situación de la lesión.\n⟶ Eco ideal para lesiones que se ven bien por eco, es similiar a la PAAF, sólo que en esta ocasión se pone anestesia local debido al calibre de las agujas.\n⟶ BEP (Biopsia escisional percutánea)\n⟶ Galactografía\n⟶ Localización de lesiones con arpón, es un procedimiento pre-quirurgico en el que se colocan los arpones guiados por eco o por mamo, para marcar la lesión y facilitar la tarea del cirujano.\n⟶ Galactografía, para estudiar los conductos galactofóros a través de un contraste yodado hidrosoluble radiopaco. Se canaliza el orificio del conducto y se introduce un pequeño catéter, se introduce el contraste hasta que haya reflujo y se hacen dos proyecciones CC y LAT, sin aplicar compresión. Se indica en casos de secreción patológica por el pezón.`,
34:`TEMA 34. RADIOLOGÍA CONVENCIONAL. DENSITOMETRÍA\n\nINTRODUCCIÓN:\nLa osteoporosis, consiste en la disminución de la masa ósea y de su resistencia mecánica, que condiciona en un aumento de la incidencia de fracturas.\n\nLa densitometría, es la técnica diagnóstica que permite medir la densidad mineral del hueso.\n\nHay diferentes zonas de estudio:\n⟶ D. de cuerpo entero: obtiene el análisis de la composición corporal determinando el porcentaje de tejido óseo, grasa, y partes blandas de todo el organísmo y su distribución por regiones.\n⟶ D de columna vertebral\n⟶ Valoración de la integración de prótesis de cadera\n⟶ lipodistrofia en pacientes con el virus de la inmunodeficiencia humana.\n\nTIPOS DE DENSITOMETRÍA\nExisten diferentes técnicas para medir la densidad mineral ósea basadas en el TC, la ecografía o la RM e isopos (absociometría fotónica simple y dual)\n\nAunque la absormetría con RX dual o de doble energía DXA, es la técnica de elección para cuantificar la masa ósea DMO (densidad mineral osea), que es el parámetro usado tanto para diagnósticode osteoporosis como en la monitorización de la respuesta al tratamiento.\n\nSe basa en la diferente absorción de los RX por los distintos componentes del organísmo.\n\nABSORCIONMETRÍA CON RX DE DOBLE ENERGÍA:\n1.EQUIPOS\nLa tecnología varía tanto en hardware (filtros, voltaje) y software (algoritmo) como en la geometría del haz, los equipos consisten en una fuente de RX y un detector de alta resolución. La fuente (tubo de RX) de baja dosis, los equipos de DXA se basan en la energía dual, osea, producen fotones de dos niveles de energía, existen dos sistemas diferentes para obtener energía dual\n⟶ 1: Emisión alternante de radiación de alto y bajo kilovoltaje\n⟶ 2: Un haz monoenergético al que se le añade un filtro de tierras raras para absorber energía separando los fotones de alta y baja energía.\n\nSegún la morfología del haz, hay dos tipos de equipos\nHAZ EN LAPICERO ⟶ colimador puntual, se registra con un único detector\nHAZ EN ABANICO ⟶ colimador en hendidura, precisa un detector múltiple.\n\nABSORCIONMETRÍA CON RX DE DOBLE ENERGÍA PORTÁTIL (esqueleto periférico)\nSon más pequeños y baratos, pero también menor fiabilidad, sirver como técnica de cribado para seleccionar pacientes que deben someterse a estudio con mesa estable.\nEl estudio con portátil se hace en la falange media del tercer dedo de la mano no dominante.\n\nABSORCIONMETRÍA CON RX DE DOBLE ENERGÍA MESA ESTABLE (esqueleto axial)\nEs el equipo más usado para el estudio de osteoporosis estudiando las regiones de columna lumbar y cadera.\n\nPROTOCOLOS DE ESTUDIO EN MESA ESTABLE\n⟶ Preparación del estudio: los pacientes no requieren una preparación específica, aunque es importante interrogar al paciente para saber:\n1. Contraindicaciones : embarazo, contraste oral 5 días antes, estudios de medicina nuclear 2 días antes,\n2. Lesiones o enfermedades óseas : fracturas, espondilitis..\n3. debemos retirar todos los objetos metálicos\n4. antes de empezar el técnico mete todos los datos del paciente en la máquina, en algunos casos la longitud del antebrazo si se va a estudiar ése área\n5. Explicación del estudio y la necesidad de permanecer quieto durante el estudio.\n\n⟶ Regiones de estudio en ADULTOS: el estudio se realiza generalmente en columna lumbar (L1-L4) y fémur proximal, añadiremos el antebrazo en pacientes en los que una de las áreas anteriores no sirva, o en pacientes con hiperparatiroidismo, ya que en ellos el antebrazo se suele afectar de manera precoz.\n⟶ Regiones de estudio en NIÑOS y ADOLESCENTES(-20): Sólo se estudia el área lumbar.\n\nCOLOCACIÓN DEL PACIENTE Y CENTRAJE\nEs muy importante que la posición sea la correcta y estandarizada y siempre igual.\n\nColumna lumbar PA ⟶ Paciente en decúbito en el centro de la mesa, y alineado con su eje, las rodillas flexionadas sobre un soporte para reducir la lordosis y acercar la columna a la mesa. El centraje se hace poniendo la luz del laser en el punto en el que se quiera empezar. La adquisición empieza desde la región inferior L5, hasta D12. Para el estudio de columna lumbar sería unos 5cm por debajo del ombligo o ligeramente por debajo del nivel de cresta ilíaca.\nLa imagen debe incluir cranealmente la vértebra D12 y costillas, y en la parte inferior L5 e ilíaco, y la columna estar centrada y recta.\n\nCadera ⟶ La densitometría de fémur se puede hacer en cualquiera de las dos, pero es útil acostumbrarse a hacer siempre la misma, a no ser que no se pueda por fracturas, etc. Ponemos al paciente en decúbito centrado en la mesa con la pierna en abducción para mantener recto el eje del fémur y en rotación interna de 15-30º. En la imagen adquirida el trocánter menor no debe ser visible, el punto de referencia para el centraje de inicio de la adquisición se sitúa en el centro del muslo, inmediatamente por debajo de la altura de la sínfisis púbica o unos cm por debajo del trocánter mayor.\nLa imagen debe incluir la cabeza femoral completa y al menos 1cm por debajo de la región del trocánter menor, hay que tener en cuenta que por la rotación interna el trocánter menor no debe aparecer en la imagen, y la diáfisis debe estar recta.\n\nAntebrazo ⟶ Se estudia el no dominante, el paciente se coloca sentado al lado de la mesa con el antebrazo apoyado y con la mano en pronación y sujeta con unas bandas. El centraje se hace en el centro de la muñeca a la altura de la estiloides cubital.\nLa imagen debe incluir 2cm de diáfisis por encima del ternio del antebrazo y parte del carpo, con el eje diafisario recto y centrado\n\nCOLOCACIÓN DEL ÁREA DE ANÁLISIS\nEl equipo se coloca de forma automática, pero en algunos casos es necesario corregir la situación del área de análisis ROI (región de interés)\n\nColumna lumbar ⟶ La ROI se situa en los cuerpos vertebrales L1 a L4, y el valor útil para el estudio es la DMO media de las cuatro vértebras, se deben excluir del análisis, las vértebras con fractura o lesión ya que alterarían la media.\nSe reconocen por el tamaño menor que la vértebra adyacente, con una densidad mucho mayor, que corresponde a una vértebra más blanca y por danto con DMO mayor.\n\nCadera ⟶ El área de análisis se debe situar en el cuello femoral, evitando la rama isquiopubiana. Lo más importante es el fémur tanto el cuello como en su totalidad.\n\nAntebrazo ⟶ La ROI se sitúa en la extremidad distal del radio con la línea de referecia en la estiloides cubital, la región más importante es el radio.\n\nINTERPRETACIÓN DEL ESTUDIO, TERMINILOGÍA\n⟶ Contenido mineral óseo: Cantidad de calcio CONCRETA\n⟶ Densidad mineral ósea: Cantidad MEDIA de calcio por unidad de área (g/cm2) o volumen (g/cm3) y se calcula dividiendo el contenido mineral óseo por un área o volumen.\n⟶ Puntuación T: Sirve para el diagnóstico de osteoporosis es mujeres posmenospáusicas y se usa también en hombres mayores de 50 años. Ésta puntuación, es el número de desviaciones estándar de diferencia entre el valor de DMO del paciente y la media de una población de referencia adulta joven de la misma raza y sexo.\nLos valores son:\n1. Normal: puntuación T >-1,0\n2. osteopenia: puntuación T entre -1 y -2,5\n3. osteoporosis: puntuación T <-2,5.\n⟶ Puntuación Z: Se usa en niños y adolescentes (hasta los 20 años) y también para mujeres premenopáusicas y hombres -de 50 años. Es el número de desviaciones estándar de diferencia entre el valor DMO del paciente y la media de una población de referencia de la misma raza, sexo y edad. Con puntuación Z inferior a -2, el diagnóstico es “densidad ósea baja para la edad”.\n\nABSORCIONMETRÍA CON RAYOS X DE DOBLE ENERGÍA AXIAL EJECUTADA CON MESA ESTABLE DE CUERPO ENTERO VALORACIÓN DE COMPOSICIÓN CORPORAL.\n1. Colocación del paciente: La mesa suele tener marcado el rectángulo en el que debe estar incluido el paciente, en decúbito supino, centrado en la mesa, con los brazos a los lados del cuerpo sin tocar las piernas y con los pulgares hacia arriba. La línea superior del rectángulo se sitúa por encima de la cabeza y es el punto de centraje de la adquisición, que en este caso es de arriba hacia abajo. ** Si el paciente es obeso, el estudio se realiza sobre medio cuerpo, para ello se deben incluir cuello, cabeza, brazo y pierna de un lado completamente en la mesa, y después el equipo realiza una estimación de todo el cuerpo.\n2. Criterios de posición correcta del paciente en la imagen adquirida (colocación del área de análisis): La imagen resultante consiste en dos representaciones del paciente que miestran respectivamente tejidos blandos y hueso. En una imagen correcta, se ve todo el cuerpo del paiente, y en la adquisición de medio cuerpo, todo un lado, cuello y cabeza. La línea que marca la ROI, se sitúa de forma automática, dependiendo de cada área anatómica correspondiente.\n\nINTERPRETACIÓN DEL ESTUDIO (TERMINOLOGÍA)\nEl equipo calcula la composición por regiones anatómicas: masa grasa, masa magra y hueso en todo el organísmo y por regiones. También obtiene la distrubución de la grasa en regiones predefinidas en el área pélvica\n⟶ Androide (central)\n⟶ Ginoide (cadera y muslos)\n⟶ La proporción grasa pélvica, es la relación entre el porcentaje de grasa de región andoirde y ginoide\n\nEl índice de masa corporal no distingue grasa de músculo. Los valores de DMO en cuerpo entero, sirven para estimar la mineralización, pero no permiten el diagnóstico de osteoporosis (en necesario hacer el estudio de columna y cadera para correlacionar con la cuervas de referencia).\n\nCONTROL DE CALIDAD\nPara calibrar el equipo y verificar la exactitud y precisión de las medidas, se debe realizar una prueba de control de calidad diario antes de empezar a hacer mediciones a los paciente. El control se hará como mínimo una vez por semana si el densitómetro no se está usando. Se usa un bloque de calibración fabricado en un material equivalente al tejido con unas cámaras que simulan hueso con contenido mineral óseo conocido.`
