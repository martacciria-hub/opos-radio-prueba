const topics={
12:`TEMA 12. VÍAS DE ADMINISTRACIÓN DE CONTRASTE\n\nINTRODUCCIÓN\nLos medios de contraste radiológicos son sustancias usadas para aumentar la capacidad diagnóstica de las técnicas de imagen.\n\nRayos X → Bario/Yodo\nRM → Gadolinio\nECO → Microburbujas de aire y otros gases\n\nCONTRASTES INTESTINALES\nVía oral → esófago, estómago e intestino delgado. Habitualmente sulfato de bario. Contraindicado ante sospecha de perforación → Gastrografin.\nVía rectal → intestino grueso. Enema opaco y doble contraste con bario + aire.\nSonda nasogástrica → comprobar siempre la correcta colocación; al finalizar, limpiar con suero para evitar obstrucciones.\nPor estoma → sonda Foley y contraste diluido con agua.\n\nCONTRASTES INTRAVASCULARES\nVía intravenosa → vena periférica, manual o con bomba.\nVía intraarterial → habitualmente arteria femoral; alternativa braquial proximal/transaxilar.\n\nCONTRASTES INTRAARTICULARES\nArtrografía: contraste directamente en una cavidad articular.\nCon RX → artro-TC con yodo no iónico diluido.\nCon RM → artro-RM con gadolinio.\n\nCONTRASTES INTRACAVITARIOS\nEn el interior de vísceras huecas mediante sonda/catéter. Usos: histerosalpingografía y cistografía retrógrada.\nOtros conductos → ureterografía, dacriografía, sialografía, galactografía y fistulografía.`,
13:`TEMA 13. CONTRASTES RADIOGRÁFICOS\n\nNEGATIVOS / RADIOTRANSPARENTES\nGases inertes como aire o CO₂. Distienden el intestino y separan las paredes de la mucosa. Usos principales: enema opaco de doble contraste. El CO₂ puede emplearse en arteriografía, siempre por debajo del diafragma.\n\nPOSITIVOS / RADIOPACOS\nSe clasifican en yodados y no yodados; los yodados, a su vez, en hidrosolubles y liposolubles.\n\nBARIO\nNo yodado. Exploraciones intestinales por vía oral o rectal. Debe ser suficientemente viscoso para recubrir la mucosa. Complicaciones: neumonitis química por aspiración, fibrosis por extravasación peritoneal en perforación y posible exacerbación de obstrucción gastrointestinal.\n\nYODADOS HIDROSOLUBLES\nSu opacificación depende de velocidad de inyección, volumen y concentración. Se clasifican por radical asociado: iónicos/no iónicos; y por número de anillos de benceno: monómeros/dímeros.\nIónicos → generan partículas cargadas, mayor osmolaridad y más efectos secundarios.\nNo iónicos → menor osmolaridad y menos efectos secundarios.\n\nCARACTERÍSTICAS\nViscosidad → depende de concentración, estructura molecular y temperatura. Menor viscosidad permite mayor velocidad de inyección.\nOsmolaridad → relacionada con la concentración de partículas y la sensación de calor.\nConcentración de yodo → directamente relacionada con la opacidad.\n\nYODADOS LIPOSOLUBLES\nDerivados del aceite de adormidera. Usos actuales: fistulografías, linfografías y algunos procedimientos intervencionistas.\n\nFARMACOLOGÍA\nVida media aproximada: 2 h. Eliminación principalmente renal y también biliar. A las 24 h se ha excretado aproximadamente el 90%.\n\nINDICACIONES\nDigestivos → bario oral/rectal; Gastrografin ante sospecha de perforación.\nUrografías → monómeros no iónicos.\nTAC → estudios multicfase tras una dosis.\nTambién radiología intervencionista, artrografías, histerosalpingografías, galactografías y sialografías.`,
14:`TEMA 14. CONTRASTES ECOGRÁFICOS\n\nSon microburbujas de gas administradas por vía intravenosa o intracavitaria. Aumentan la señal ecográfica mediante la interacción de las ondas con las burbujas y sus movimientos de compresión/expansión, generando ecos armónicos.\n\nDEBEN SER\nInertes y no tóxicos · diámetro muy pequeño · estables · buena interacción con el haz de ultrasonidos.\n\nMOLÉCULAS Y DOSIS\nGases poco solubles como hexafluoruro de azufre y octafluoropropano. Preparación con suero salino + molécula. Dosis habitual: 2,4 ml IV seguida de 5–10 ml de suero.\n\nEFECTOS ADVERSOS\nCefalea, mareos, náuseas/vómitos, alteración del gusto, calor, parestesias, edema cutáneo y escozor.\n\nCONTRAINDICACIONES\nSíndrome coronario agudo, miocardiopatía isquémica inestable, trastornos del ritmo cardíaco, determinadas derivaciones cardíacas y síndrome de dificultad respiratoria.\nNo son nefrotóxicos ni interfieren con la función tiroidea.\n\nINDICACIONES\nEspecial utilidad en hígado para caracterización de lesiones focales. Fase arterial: 10–35 s. Portal: 60–120 s. Tardía: 240–360 s.\nTambién: riñón, reflujo vesicoureteral, páncreas, intestino, mama, pelvis femenina, próstata, adenopatías y traumatismos abdominales leves.`,
15:`TEMA 15. CONTRASTES EN RESONANCIA MAGNÉTICA\n\nLos contrastes en RM incrementan las diferencias de señal entre tejidos. Pueden ser naturales (líquido amniótico, bilis, derrame articular) o químicos.\n\nGADOLINIO\nEl contraste más utilizado es gadolinio unido a un agente quelante. Se diferencian por osmolaridad, ionicidad, viscosidad y estabilidad del quelante. Los quelantes cíclicos son más estables y menos propensos a liberar gadolinio libre.\n\nPARAMAGNETISMO\nEl gadolinio acorta los tiempos de relajación. Acortar T1 → hiperintensidad en T1. Acortar T2 → hipointensidad en T2. El contraste no se ve directamente: se observan sus efectos sobre la señal.\n\nVÍAS\nIntravenosa (más frecuente), oral, rectal, intracavitaria y subcutánea.\n\nIMAGEN\nTras gadolinio se emplean secuencias T1, Spin Echo o Gradient Echo, habitualmente con supresión grasa. En estudios dinámicos se obtiene una máscara para realizar sustracciones. Se usan secuencias rápidas Gradient Echo y adquisiciones volumétricas sincronizadas con la inyección y la apnea.\n\nCONTRASTES HEPATOESPECÍFICOS\nLos agentes de distribución intracelular son captados por hepatocitos y permiten caracterizar lesiones focales y valorar vía biliar. Los intracelulares se eliminan casi totalmente por vía biliar; los mixtos combinan distribución extracelular e intracelular.\nAusencia de captación → ausencia de hepatocitos en la lesión. Presencia de captación → naturaleza hepatocitaria.\n\nINTRAVASCULAR\nGadofosveset trisódico permanece más tiempo en sangre y permite estudios dinámicos de angio-RM y fase de equilibrio.\n\nSUPERPARAMAGNÉTICOS\nPartículas de óxido de hierro con capacidad de acortar T1 y T2. Actualmente en desuso.\n\nENTERALES\nPueden ser positivos o negativos según la señal. Agua con metilcelulosa puede utilizarse por vía oral o rectal. El gadolinio oral a baja concentración puede comportarse como contraste positivo en T1.`,
16:`TEMA 16. OTROS FÁRMACOS EN RADIOLOGÍA Y CARRO DE PAROS\n\nCARRO DE PAROS\nDebe estar accesible, visible, ordenado y revisado periódicamente. Dotación básica: material de ventilación y apertura de vías, soporte circulatorio, fármacos, monitor-desfibrilador, ECG, monitor de presión arterial y frecuencia cardíaca y pulsioxímetro.\n\nSEDACIÓN Y ANESTESIA\nAnalgesia: anestésicos locales (lidocaína, bupivacaína), AINEs, paracetamol y opioides como fentanilo y morfina.\nSedación: benzodiacepinas como midazolam, diazepam y lorazepam.\n\nCORAZÓN\nCardio-RM de estrés → dipiridamol/adenosina producen vasodilatación coronaria e isquemia miocárdica relativa. Dobutamina aumenta contractilidad y frecuencia cardíaca.\nAngio-TC coronaria → puede requerir betabloqueantes para controlar la frecuencia y nitroglicerina sublingual para vasodilatar las coronarias.\n\nAPARATO URINARIO\nFurosemida → diurético que aumenta la producción de orina y distiende la vía urinaria para mejorar su visualización.\n\nAPARATO DIGESTIVO\nAntiperistálticos → relajan la musculatura lisa para valorar el tubo digestivo.\nSecretina → estimula la secreción exocrina pancreática y favorece la relajación del esfínter de Oddi; útil en RM ante sospecha de pancreatitis crónica.\nLaxantes → eliminan restos fecales para mejorar la valoración de paredes intestinales.`,
17:`TEMA 17. COMPLICACIONES Y REACCIONES ADVERSAS\n\nUna reacción adversa es cualquier efecto producido por un contraste que no sea el aumento de la capacidad diagnóstica.\n\nTIPOS\nToxicidad celular directa → relacionada con dosis y osmolaridad; es predecible y puede reducirse usando baja osmolaridad y ajustando la dosis.\nReacciones alérgicas/seudoalérgicas → no guardan relación clara con la dosis y son impredecibles.\n\nREACCIONES NO RENALES\nAgudas: durante la primera hora. Leves, moderadas o graves (shock anafiláctico).\nFactores de riesgo: antecedentes de reacción, asma y otras alergias. Prevención: contraste no iónico, vigilancia durante 30 min y carro de paros disponible. En alto riesgo puede considerarse estudio alternativo, otro contraste o premedicación.\nTardías: entre 1 h y 1 semana, habitualmente leves/moderadas.\nMuy tardías: más de una semana. Tirotoxicosis por yodo y fibrosis sistémica nefrogénica asociada a gadolinio, especialmente con insuficiencia renal avanzada.\n\nNEFROTOXICIDAD\nLa nefropatía inducida por contraste aparece habitualmente en los primeros días. Principal predictor: disfunción renal previa. Prevención: valorar estudio alternativo, evitar nefrotóxicos y deshidratación, usar la menor dosis y baja osmolaridad e hidratar cuando esté indicado.\n\nEXTRAVASACIÓN\nComplicación local frecuente. Medidas: detener administración, elevar miembro, aplicar frío local, observar y documentar; consultar cirugía en lesiones graves.\n\nSITUACIONES ESPECIALES\nDiálisis → el contraste yodado no requiere sincronizar el estudio con la hemodiálisis. Con gadolinio se debe valorar el momento de la sesión y evitar agentes de alto riesgo.\nMetformina → el problema es el posible deterioro renal que favorezca acumulación de lactato y acidosis láctica. Las recomendaciones dependen de la función renal y de si el estudio es programado o urgente.\nFeocromocitoma/paraganglioma → preferir contrastes yodados no iónicos; RM puede ser alternativa.\nEmbarazo/lactancia → valorar siempre riesgo/beneficio y alternativas.\n\nINTERACCIONES\nRegistrar historia farmacológica y datos del contraste. No mezclar contraste con otros fármacos en el mismo sistema. Fármacos de riesgo: metformina, nefrotóxicos, betabloqueantes e interleucina-2. Los yodados reducen la captación del radioyodo y pueden interferir con estudios con isótopos.\n\nCONTRASTE ECOGRÁFICO\nLas reacciones graves son infrecuentes. Deben descartarse intolerancias y usar los parámetros mínimos necesarios.\n\nCONTRASTES HEPATOESPECÍFICOS EN RM\nPueden contener gadolinio, manganeso u óxido de hierro. Las precauciones dependen del agente y de la función renal, hepática o de la sobrecarga de hierro.\n\nBARIO ORAL\nContraindicado cuando existe compromiso de la pared intestinal. Precaución en estenosis. Complicaciones: disminución de motilidad, extravasación y aspiración.`
};

const tests={
12:[['¿Qué contraste se utiliza habitualmente por vía oral para estudiar el tubo digestivo?',['Sulfato de bario','Gadolinio','Microburbujas','CO₂'],'Sulfato de bario'],['Ante sospecha de perforación intestinal, ¿qué alternativa se indica?',['Gastrografin','Bario de alta densidad','Gadolinio','Aire exclusivamente'],'Gastrografin'],['¿Cuál es una vía intravascular de administración?',['Intravenosa','Oral','Rectal','Intraarticular'],'Intravenosa'],['¿Qué técnica utiliza contraste dentro de una articulación?',['Artrografía','Dacriografía','Galactografía','Sialografía'],'Artrografía'],['¿Qué contraste se utiliza en una artro-RM?',['Gadolinio','Bario','CO₂','Yodo liposoluble'],'Gadolinio']],
13:[['¿Cuál es un contraste negativo radiotransparente?',['Aire','Bario','Yodo','Gadolinio'],'Aire'],['¿Cuál es el contraste no yodado usado habitualmente en exploraciones intestinales?',['Bario','Gadolinio','CO₂ intravenoso','Manganeso'],'Bario'],['¿Qué característica favorece una mayor velocidad de inyección?',['Menor viscosidad','Mayor viscosidad','Mayor densidad','Menor concentración de yodo siempre'],'Menor viscosidad'],['¿Qué tipo de contraste genera partículas con carga eléctrica al entrar en contacto con la sangre?',['Iónico','No iónico','Liposoluble no yodado','Enteral negativo'],'Iónico'],['La concentración de yodo está directamente relacionada con:',['La opacidad','El tamaño del paciente','La frecuencia cardíaca','La temperatura corporal'],'La opacidad']],
14:[['¿Qué son los contrastes ecográficos?',['Microburbujas de gas','Cristales de gadolinio','Sales de bario','Partículas de plomo'],'Microburbujas de gas'],['¿Qué fenómeno producen las microburbujas al interactuar con el ultrasonido?',['Oscilación de compresión/expansión','Ionización','Aniquilación','Efecto fotoeléctrico'],'Oscilación de compresión/expansión'],['¿Qué órgano tiene especial utilidad para el contraste ecográfico?',['Hígado','Fémur','Tiroides exclusivamente','Cerebelo'],'Hígado'],['¿En qué fase se estudia habitualmente la llegada arterial del contraste ecográfico hepático?',['10–35 s','60–120 s','240–360 s','24 h'],'10–35 s'],['¿Los contrastes ecográficos son nefrotóxicos?',['No','Sí, siempre','Solo en niños','Solo con gadolinio'],'No']],
15:[['¿Cuál es el contraste más utilizado en RM?',['Gadolinio','Bario','Yodo','CO₂'],'Gadolinio'],['El gadolinio acorta principalmente T1 y produce:',['Hiperintensidad en T1','Hipointensidad en T1','Ningún efecto','Sólo efecto en RX'],'Hiperintensidad en T1'],['¿Cuál es la vía más frecuente de administración del gadolinio?',['Intravenosa','Rectal','Subcutánea','Oral'],'Intravenosa'],['¿Qué secuencias se emplean habitualmente tras gadolinio?',['T1','Solo T2','Solo difusión','Solo STIR'],'T1'],['¿Qué indican los estudios hepatoespecíficos con ausencia de captación?',['Ausencia de hepatocitos en la lesión','Lesión obligatoriamente benigna','Mayor concentración de bario','Presencia de aire'],'Ausencia de hepatocitos en la lesión']],
16:[['¿Qué elemento forma parte del carro de paros?',['Monitor-desfibrilador','Bomba de contraste únicamente','Chasis CR','Rejilla antidifusora'],'Monitor-desfibrilador'],['¿Qué fármaco puede utilizarse para sedación?',['Midazolam','Bario','Gadolinio','Furosemida exclusivamente'],'Midazolam'],['En cardio-RM de estrés, la dobutamina aumenta principalmente:',['Contractilidad y frecuencia cardíaca','La diuresis','La secreción pancreática','La densidad ósea'],'Contractilidad y frecuencia cardíaca'],['¿Qué fármaco puede utilizarse para distender la vía urinaria?',['Furosemida','Secretina','Nitroglicerina','Atropina exclusivamente'],'Furosemida'],['¿Qué hormona se utiliza en RM para valorar la respuesta secretora pancreática?',['Secretina','Insulina','Adrenalina','Tiroxina'],'Secretina']],
17:[['¿De qué depende principalmente la toxicidad celular directa del contraste?',['Dosis y osmolaridad','Solo edad','Color de la imagen','Matriz digital'],'Dosis y osmolaridad'],['¿Cuándo se consideran agudas las reacciones adversas?',['Durante la primera hora','Entre 1 y 7 días','Después de un año','Solo durante la inyección'],'Durante la primera hora'],['¿Cuál es el principal predictor de nefropatía inducida por contraste?',['Disfunción renal previa','Miopía','Edad del detector','Matriz pequeña'],'Disfunción renal previa'],['Ante una extravasación, ¿qué debe hacerse primero?',['Detener la administración','Aumentar la velocidad','Aplicar contraste adicional','Masajear con fuerza'],'Detener la administración'],['¿Qué fármaco requiere especial valoración en pacientes que reciben contraste yodado por el riesgo asociado a deterioro renal?',['Metformina','Paracetamol','Lidocaína','Secretina'],'Metformina'],['¿Qué complicación tardía se asocia al gadolinio en pacientes con insuficiencia renal avanzada?',['Fibrosis sistémica nefrogénica','Tirotoxicosis','Neumonitis por bario','Pancreatitis automática'],'Fibrosis sistémica nefrogénica']]

const titles={12:'TEMA 12 · VÍAS DE ADMINISTRACIÓN DE CONTRASTE',13:'TEMA 13 · CONTRASTES RADIOGRÁFICOS',14:'TEMA 14 · CONTRASTES ECOGRÁFICOS',15:'TEMA 15 · CONTRASTES EN RESONANCIA MAGNÉTICA',16:'TEMA 16 · OTROS FÁRMACOS EN RADIOLOGÍA Y CARRO DE PAROS',17:'TEMA 17 · COMPLICACIONES Y REACCIONES ADVERSAS'};
function buildMenus(){for(const id of Object.keys(topics)){const b=document.createElement('button');b.className='topicBtn';b.innerHTML='<b>'+titles[id]+'</b>';b.onclick=()=>openTopic(id);document.getElementById('topicButtons').appendChild(b);const t=document.createElement('button');t.className='testTopic';t.textContent=titles[id];t.onclick=()=>startTest(id);document.getElementById('testTopics').appendChild(t)}}
function showSection(s){document.getElementById('temas').classList.toggle('hidden',s!=='temas');document.getElementById('tests').classList.toggle('hidden',s!=='tests');document.getElementById('tabTemas').classList.toggle('active',s==='temas');document.getElementById('tabTests').classList.toggle('active',s==='tests');if(s==='tests')showTests()}
function openTopic(id){document.getElementById('topicList').classList.add('hidden');document.getElementById('topicView').classList.remove('hidden');document.getElementById('topicText').textContent=topics[id]}
function closeTopic(){document.getElementById('topicView').classList.add('hidden');document.getElementById('topicList').classList.remove('hidden')}
let current=[],pos=0,score=0,answered=false;
function showTests(){document.getElementById('testMenu').classList.remove('hidden');document.getElementById('quiz').classList.add('hidden');document.getElementById('res').classList.add('hidden')}
function startTest(id){current=tests[id];pos=0;score=0;document.getElementById('testMenu').classList.add('hidden');document.getElementById('res').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');renderQuestion()}
function renderQuestion(){answered=false;const x=current[pos];document.getElementById('n').textContent='Pregunta '+(pos+1)+' de '+current.length;document.getElementById('m').textContent=score+' aciertos';document.getElementById('p').style.width=((pos)/current.length*100)+'%';document.getElementById('q').textContent=x[0];const o=document.getElementById('o');o.innerHTML='';x[1].forEach(v=>{const b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>answer(b,v,x[2]);o.appendChild(b)});document.getElementById('f').classList.add('hidden');document.getElementById('next').classList.add('hidden')}
function answer(btn,v,right){if(answered)return;answered=true;const opts=document.querySelectorAll('.opt');opts.forEach(b=>b.disabled=true);if(v===right){score++;btn.classList.add('correct');document.getElementById('f').textContent='✅ ¡Correcta!'}else{btn.classList.add('wrong');opts.forEach(b=>{if(b.textContent===right)b.classList.add('correct')});document.getElementById('f').textContent='❌ La respuesta correcta es: '+right}document.getElementById('f').classList.remove('hidden');document.getElementById('next').classList.remove('hidden');document.getElementById('next').textContent=pos===current.length-1?'Ver resultado':'Siguiente'}
function next(){if(pos<current.length-1){pos++;renderQuestion()}else finish()}
function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('res').classList.remove('hidden');const pct=Math.round(score/current.length*100);document.getElementById('score').textContent=pct+'%';document.getElementById('msg').textContent=pct>=80?'🔥 ¡Muy buen resultado!':pct>=60?'💪 ¡Vas bien, seguimos!':'📚 Repasa el tema y vuelve a intentarlo.';document.getElementById('review').innerHTML='<p>Has acertado <b>'+score+'</b> de <b>'+current.length+'</b> preguntas.</p>'}
buildMenus();
</script>
</body>
</html>
