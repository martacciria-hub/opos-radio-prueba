<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172c4b"><title>Opos-Radio · Reto</title><style>:root{--bg:#f3f7fb;--card:#fff;--ink:#172c4b;--muted:#68788b;--a:#2c78b8;--ok:#238b63;--bad:#c94b4b;--line:#dce5ee}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#f5f9fc,#edf3fa);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 14px 110px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head a{color:var(--a);font-weight:bold;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 8px 28px #172c4b12}.progress{height:10px;background:#e8edf3;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--a);width:0}.q{font-size:1.25rem;font-weight:bold;margin:22px 0}.answers{display:grid;gap:10px}.answer{border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);padding:15px;text-align:left;font:inherit;cursor:pointer}.answer.correct{border-color:var(--ok);background:#ecf8f2}.answer.wrong{border-color:var(--bad);background:#fff0f0}.feedback{margin-top:14px;padding:14px;border-radius:14px;background:#f3f7fa}.next,.again{width:100%;border:0;border-radius:14px;padding:15px;margin-top:15px;background:var(--a);color:#fff;font-weight:bold;font-size:1rem}.hidden{display:none}.score{text-align:center;font-size:3rem;font-weight:bold;color:var(--a)}.tag{display:inline-block;background:#edf5fb;color:var(--a);padding:6px 10px;border-radius:999px;font-weight:bold;font-size:.82rem}</style></head><body><main class="wrap"><div class="head"><div><h1>🩻 Opos-Radio</h1><span class="tag" id="modeTag">Reto</span></div><a href="retos.html">← Volver a retos</a></div><section class="card" id="quiz"><div><b id="counter"></b></div><div class="progress" style="margin-top:10px"><i id="bar"></i></div><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="feedback hidden" id="feedback"></div><button class="next hidden" id="next">Siguiente →</button></section><section class="card hidden" id="result"><h2>🎉 ¡Reto terminado!</h2><div class="score" id="score"></div><p id="summary" style="text-align:center"></p><button class="again" onclick="location.href='retos.html'">🏆 Volver a retos</button></section></main><script>
const QUESTIONS=[
{t:18,q:'¿Qué factor se relaciona principalmente con la penetración del haz de rayos X?',a:['mAs','kV','Tiempo de exposición','DFP'],c:1,e:'El kV controla principalmente la energía y penetración del haz.'},
{t:19,q:'En la proyección AP de antebrazo, ¿cómo se coloca habitualmente la mano?',a:['En pronación','En supinación','En lateral estricta','En flexión'],c:1,e:'Para la AP de antebrazo se coloca la mano en supinación.'},
{t:20,q:'¿Qué proyección de pelvis permite valorar especialmente el anillo pélvico superior en traumatismos?',a:['Inlet','Outlet','Falso perfil','Rana'],c:0,e:'La proyección Inlet permite valorar la parte superior del anillo pélvico.'},
{t:21,q:'¿Qué proyección de rodilla explora especialmente la región posterior femorotibial?',a:['Schuss','Lateral','AP','Axial de rótula'],c:0,e:'La Schuss es una PA en carga y permite estudiar la región posterior femorotibial.'},
{t:23,q:'¿Qué proyección de cráneo permite valorar el occipital y los peñascos?',a:['Caldwell','Towne','Waters','Hirtz'],c:1,e:'La Towne es una proyección axial AP orientada a occipital y peñascos.'},
{t:24,q:'En las oblicuas lumbares, la pars interarticularis corresponde en el signo del perro a:',a:['El ojo','El cuello','La oreja','La pata delantera'],c:1,e:'En el perro de Scottie, la pars interarticularis corresponde al cuello.'},
{t:25,q:'¿Por qué se realiza habitualmente la radiografía de tórax PA con el lado izquierdo más próximo al receptor?',a:['Para magnificar el corazón','Para reducir la magnificación cardíaca','Para aumentar la dosis','Para visualizar el hígado'],c:1,e:'Así se reduce la magnificación de la silueta cardíaca.'},
{t:26,q:'¿Qué proyección de abdomen es básica en el estudio simple?',a:['AP en decúbito supino','AP en bipedestación','Lateral','Decúbito lateral'],c:0,e:'La AP en decúbito supino es la proyección básica.'},
{t:27,q:'En un enema opaco de doble contraste, ¿qué se añade para distender el colon?',a:['Yodo intravenoso','Aire','Gadolinio','Suero intravenoso'],c:1,e:'Se introduce aire para distender el colon y estudiar mejor la mucosa.'},
{t:34,q:'¿Qué técnica es de elección para cuantificar la densidad mineral ósea?',a:['RM','Ecografía','DXA','TC sin contraste'],c:2,e:'La DXA es la técnica de elección para cuantificar la densidad mineral ósea.'},
{t:34,q:'¿Qué puntuación se utiliza habitualmente para diagnosticar osteoporosis en mujeres posmenopáusicas?',a:['Puntuación Z','Puntuación T','IMC','Índice cortical'],c:1,e:'La puntuación T compara con una población adulta joven de referencia.'},
{t:34,q:'Una puntuación T de -2,8 corresponde a:',a:['Normal','Osteopenia','Osteoporosis','Densidad alta'],c:2,e:'Una T inferior a -2,5 se considera osteoporosis.'},
{t:19,q:'En la proyección AP de hombro con rotación externa se visualiza especialmente:',a:['Troquín','Troquíter','Olécranon','Escafoides'],c:1,e:'La rotación externa permite visualizar el troquíter.'},
{t:21,q:'¿Qué proyección del tobillo está indicada para visualizar la mortaja?',a:['AP mortaja','Lateral de pie','Broden','Schuss'],c:0,e:'La AP en mortaja, con rotación interna, abre la articulación del tobillo.'}
];
const modes={daily:{name:'🌟 Reto del día',n:10,xp:100},speed:{name:'⚡ Reto exprés',n:5,xp:80},perfect:{name:'💯 Reto perfecto',n:10,xp:150},module4:{name:'🩻 Dominador/a del Módulo 4',n:10,xp:120}};
const mode=new URLSearchParams(location.search).get('mode')||'daily';const cfg=modes[mode]||modes.daily;document.getElementById('modeTag').textContent=cfg.name;
let list=[...QUESTIONS];if(mode==='module4')list=list.filter(q=>q.t>=18);list=list.sort(()=>Math.random()-.5).slice(0,cfg.n);let i=0,hits=0,locked=false;const state=JSON.parse(localStorage.getItem('oposRadioGame')||'null')||{name:'Aspirante',avatar:'👩',xp:0,correct:0,answered:0,total:0,streak:0,bestStreak:0,perfect:0,days:0,lastDay:'',recent:[]};
function save(){localStorage.setItem('oposRadioGame',JSON.stringify(state))}function show(){const q=list[i];locked=false;document.getElementById('counter').textContent='Pregunta '+(i+1)+' de '+list.length;document.getElementById('bar').style.width=(i/list.length*100)+'%';document.getElementById('question').textContent=q.q;document.getElementById('answers').innerHTML=q.a.map((x,j)=>'<button class="answer" onclick="answer('+j+')">'+String.fromCharCode(65+j)+'. '+x+'</button>').join('');document.getElementById('feedback').classList.add('hidden');document.getElementById('next').classList.add('hidden')}function answer(j){if(locked)return;locked=true;const q=list[i],bs=[...document.querySelectorAll('.answer')],ok=j===q.c;bs.forEach((b,k)=>{b.disabled=true;if(k===q.c)b.classList.add('correct');if(k===j&&!ok)b.classList.add('wrong')});if(ok)hits++;state.answered++;if(ok)state.correct++;state.streak=ok?state.streak+1:0;state.bestStreak=Math.max(state.bestStreak,state.streak);const f=document.getElementById('feedback');f.classList.remove('hidden');f.innerHTML=(ok?'✅ <b>¡Correcto!</b> ':'❌ <b>Incorrecta.</b> ')+q.e;document.getElementById('bar').style.width=((i+1)/list.length*100)+'%';document.getElementById('next').classList.remove('hidden');save()}document.getElementById('next').onclick=()=>{if(i<list.length-1){i++;show()}else finish()};function finish(){let bonus=cfg.xp;if(mode==='perfect'&&hits<list.length)bonus=50;if(mode==='speed')bonus=Math.min(80,hits*12);if(mode==='daily')state.lastDay=new Date().toISOString().slice(0,10);if(hits===list.length)state.perfect++;state.xp+=bonus;state.total++;save();document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('score').textContent=hits+'/'+list.length;document.getElementById('summary').innerHTML='<b>+'+bonus+' XP</b><br>'+state.name+', sigue así 💪';}show();
</script></body></html>
