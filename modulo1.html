const topics={
1:`TEMA 1. HISTORIA, INTRODUCCIÓN Y TÉCNICA RADIOGRÁFICA\n\nINTRODUCCIÓN:\n\nRadiología es la especialidad médica que diagnóstica o trata una enfermedad, utilizando métodos de imágenes basadas en radiaciones ionizantes u otras fuentes de energía. El trabajo del técnico es obtener las imágenes adecuadas para la lectura posterior por parte del radiólogo, de la excelencia de ambos depende el resultado final.\n\nHISTORIA:\n\nlas investigaciones previas al descubrimiento de los Rx, se centraban en los estudios de la corriente eléctrica, a través de gases encerrados en tubos con distintos grados de vacío en su interior.\n\nLos primeros avances en la radiología se centraron en perfeccionar el generador de corriente eléctrica, el tubo y las placas, la inclinación del ánodo cambió 20º y finalmente, se ideó el ánodo giratorio para disminuir la superficie de impacto. A finales de los 70, llegó el estudio de RM aunque no en hospitales, en cuanto a antecedentes a los ultrasonidos (ECO) se menciona a Pierre Curie, cuyas primeras aplicaciones fueron para estudios militares como el sónar.\n\nCRONOLOGÍA:\n\n1845: Nace en Alemania W.C Röntgen.\n1895 (8/Nov): Descubre los RX\n1895 (22/Dic): 1ª radiografía a la mano de su mujer.\n1911: Marie Curie ⟶ Radio\n1913: Salomon ⟶ Mamografía\n1952: F.Bloch y Purcell ⟶ Fenómeno Resonancia Magnética\n1961 ⟶ Se regula en España (enfermeros especialistas en rayos)\n1972: 1er protocolo de TAC cerebral\n1973: Lauterbur y Ter-Pogossian ⟶ PET\n1977 ⟶ 1ª promoción de TECNICOS DE RAYOS\n1979: Hounsfield y Cormack ⟶ Imágenes de TAC\n1981 ⟶ Radiología\n1990 ⟶ TAC Helicoidal\n1995 ⟶ TSID\n2003: Lautebur y Mansfield ⟶ Imágenes de Resonancia Magnética\n2014 ⟶ TECNICO SUPERIOR EN IMAGEN PARA EL DIAGNÓSTICO Y MEDICINA NUCLEAR`,
2:`TEMA 2. RAYOS X, GENERALIDADES\n\nINTRODUCCIÓN:\nÁTOMO\nEl átomo es la unidad básica de toda materia, su estructura se divide en:\nNÚCLEO ⟶ Formado por protones y neutrones ( con la misma carga)\nCORTEZA ⟶ Electrones (-), tienen 200 veces menos masa que un protón.\nEl diámetro de un átomo es de 10 elevado a -10 m.\nDenominamos “número atómico” (Z) a la cantidad de protones presentes en un elemento.\nCorteza Eléctrica ⟶ Los electrones que se encuentran en las capas más cerca del núcleo tienen una energía de ligadura mayor a los que están en las capas más externas del átomo. Cada electrón tiene una energía dependiendo de la capa en la que esté.\nCERCA DEL NÚCLEO ⟶ Poco energéticos, mucha ligadura.\nLEJOS DEL NÚCLEO ⟶ Muy energéticos, poca ligadura.\n\nTRANSICIONES ELECTRÓNICAS\nLos electrones de un átomo, pueden saltar de unas capas a otras, siempre que, no se sobrepase la cantidad de electrones asignada a la capa.\nEn estas transiciones, los electrones tienen que ganar energía (si “sube”) o perder energía (si “baja”).\n\nRADIACIÓN ELECTROMAGNÉTICA\nEs la emisión y transmisión de energía en forma de ONDA MAGNÉTICA, transformando la energía a través del espacio, en forma de vibración de campos eléctricos y magnéticos, y lo hace a la velocidad de la luz.\n\nABSORCIÓN Y EMISION DE ENERGÍA POR LOS ÁTOMOS ( EXCITACIÓN Y DESEXCITACIÓN )\nCuando se da energía a un átomo, alguno de los electrones que están en las capas más internas, pueden saltar a capas superiores ⟶ ÁTOMO EXCITADO.\n\nIONIZACIÓN: Cuando la energía que se da al átomo es más fuerte que la de ligadura del electrón, “arrancamos” el electrón del átomo. Dando como resultado un átomo con carga positiva por un lado, y un electrón con carga negativa por otro.\n\nRADIACIÓN DE FRENADO: Descubierto por Nicola Tesla, es otro fenómeno físico, involucrado en la generación de Rx. Se define como radiación electromagnética por la deceleración de una partícula cargada.\nEj: Un electrón, cuando se desvía “por culpa” de otra partícula cargada como el núcleo.\nA éste fenómeno también se lo llama “Free-Free radiation”, porque es producido por una partícula libre y cargada, antes y después de la aceleración que produce la emisión.\n\nPROCEDENCIA DE LOS Rx\nAlgunas transiciones electrónicas de las capas de fuera hacia dentro, llevan asociada la emisión de fotones de Rx.\nSegún la energía de desexcitación del átomo (energía que emite al pasar a estado Neutro), se tendrá como resultado una radiación electromagnética de una u otra naturaleza.\n⟶ Rayos Gamma\n⟶ Rayos X\n⟶ Ultravioleta...\n\nINTERACCIÓN CON LA MATERIA\nLos Rayos X, pueden atravesar cuerpos impermeables a la luz, aunque ésta propiedad es limitada, ya que los Rx se atenúan cuando atraviesan materia.\nUn principio general de la interacción de la radiación con su entorno, es que ésta suele acontecer con partículas o estructuras de tamaño cercanos a los de su longitud de onda.\nRayos de BAJA ENERGÍA ⟶ Interactúan con átomos enteros\nRayos de ENERGÍA MODERADA ⟶ Interactúan con los electrones.\nRayos de ALTA ENERGÍA ⟶ Interactúan con el núcleo del átomo.\n\nEFECTOS DE RADIACIÓN\nDISPERSIÓN COHERENTE / THOMSON\nNo vale la pena para el radiodiagnóstico, el fotón que incide, es reemitido con la misma energía pero desviado ligeramente\n\nEFECTO COMPTON\nEl fotón que incide, interacciona con los electrones más externos y lo arranca, perdiendo parte de su energía y variando su trayectoria.\nEl átomo se ioniza, y tanto el fotón incidente como el electrón arrancado pueden seguir ionizando, hasta que son absorbidos.\n\nEFECTO FOTOELÉCTRICO\nEl fotón incidente choca con los electrones más cercanos al núcleo es absorbido por el átomo arrancando un electrón que puede ir ionizando otros átomos hasta su absorción por otro átomo que también será ionizado.\n\nPRODUCCIÓN DE PARES\nUn fotón X con mucha energía, llega cerca del núcleo y sufre una “materialización” en un par de partículas (electrón y positrón), para ello es necesaria una energía mínima de 1.020 KeV\n\nDESINTEGRACIÓN FOTÓNICA\nEl núcleo absorbe el fotón que incide y se produce la emisión de un nucleón u otro fragmento nuclear, eso supone usar una energía superior a 10.000 KeV.\n\nNota:\n⟶ El E. Thomson y el E. Compton, son procesos de dispersión (el fotón que incide “sigue vivo”)\n⟶ El E.Fotoeléctrico, La Producción de Pares y La Desintegración Fotónica, son procesos de absorción del fotón incidente (el fotón que incide “desaparece”).\n\*\* Para el uso de los Rx en medicina, sólo serán de interés el E. Thomson y el E. Fotoeléctrico\n\nATENUACIÓN DIFERENCIAL DE LOS Rx\n1.GEOMÉTRICO: La intensidad de la Radiación decrecerà con el inverso del cuadrado a la distancia entre el foco y el punto de medida. Es decir, alejarse 2 veces es dividir por 4 la intensidad radiactiva. “LEY DEL INVERSO DEL CUADRADO DE LA DISTANCIA”\n2.INTERACCIÓN: Cuando el Haz de Rx atraviesa un medio, sus fotones interaccionan con algún tipo de materia (gas, líquido, solido, aire). Los fotones desaparecen por procesos de absorción y lo que llega al receptor de imagen es aprox. el 1% de los Rx.\n\nFACTORES QUE INFLUYEN:\n⟶ Energía de Rx: + Energía - Atenuación / + Energía + Longitud de Onda / + Penetración - Atenuación\n⟶ Número Atómico (Z): + Nº + Atenuación.\n⟶ Densidad másica del medio: +Densidad + Atenuación\n\nPROPIEDADES DE LOS Rx\nPRINCIPALES:\n⟶ Son radiación electromagnética, van en línea recta a la velocidad de la luz, transportan energía y se atenúan con el inverso del cuadrado a la distancia.\n⟶ No tienen ni masa ni carga\n⟶ Radiación ionizante (E.Compton y E. Fotoeléctrico)\n⟶ Penetran y atraviesan estructuras que son opacas a otros tipos de radiación\n\nOTROS:\n⟶ Producen efectos biológicos (perniciosos para la salud)\n⟶ Producen fluorescencia en algunas sustancias\n⟶ Pueden ennegrecer emulsiones fotográficas\n⟶ Ionizan los gases que atraviesan.`,
3:`TEMA 3. PRODUCCIÓN DE RAYOS X. GENERADORES Y TUBOS\n\nINTRODUCCIÓN\nMODALIDAD es la terminología actual para referirnos a cualquier equipo de radiodiagnóstico.\n\nPARTES COMUNES DE UN EQUIPO CONVENCIONAL DE RADIODIAGNÓSTICO:\n⟶ TUBO DE Rx: Emisor de la radiación que proporcionará la imagen\n⟶ GENERADOR ELÉCTRICO: Transformadores y rectificadores (armario eléctrico)\n⟶ SUSPENSIÓN DE TECHO: Carriles que permiten el desplazamiento del Tubo\n⟶ MESA DE EXPLORACIÓN: Para proyecciones en decúbito (Bucky mesa)\n⟶ DISPOSITIVO MURAL: Para proyecciones en decúbito (Bucky mural)\n⟶ COLIMADORES: Plomos móviles que permiten dar forma y tamaño al haz de Rx.\n\nTUBO DE RAYOS X\nSe trata de una ampolla de cristal en la que se realiza vacío, donde se generan los rayos X, sus partes son:\n\nCORAZA tiene dos funciones: PROTECCIÓN RADIOLÓGICA (es de plomo y evita la radiación de fuga), PROTECCIÓN ELÉCTRICA (aporta aislamiento eléctrico y además contiene aceite para refrigerar el tubo).\n\nAMPOLLA: Se encuentra dentro de la coraza, está hecha de cristal de PYREX, genera el vacío electrónico, sus partes más destacables son:\n⟶ Cátodo: Lado negativo del tubo tiene dos partes\n1. Filamento: Es una espiral de alambre de TUNGSTENO, de donde son “arrancados” los electrones con corriente\n2. Copa de Enfoque: Es un recipiente metálico que cubre el filamento y deja una apertura para que salgan los electrones (se carga negativamente para repelerlos)\n⟶ Ánodo: Lado positivo del tubo, donde impactan los electrones del filamento. Existen ánodos estacionarios, rotatorios y suelen estar fabricados de cobre.\n⟶ Funciones de la Ampolla: Es conductor eléctrico, proporciona soporte mecánico al blanco, deber ser buen conductor térmico.\n\nDIFERENCIAS ENTRE ÁNODOS\nÁnodo Rotatorio: Aumenta el punto focal (blanco) donde impactan los electrones y el área de interacción es mayor.\nÁnodo Estacionario: Se Suelen usar en aparatos portátiles y en odontológicos.\n\n*Punto Focal (área del blanco), casi todos los tubos de Rx, tienen dos puntos focales (fino/grueso), cuando más pequeño sea el punto focal, más nítidas y con mayor resolución serán las imágenes que se obtengan.\nSuele ser de tungsteno, por su alto nº atómico, su alta conductividad térmica y su punto de fusión alto (lo que evita que se funda)\n\nEFECTO TALÓN: Es una consecuencia del ángulo de construcción que se le da al ánodo. Se define como una falta de homogeneidad en el campo de Rx, en la dirección ánodo ⟶ cátodo. El Haz es más intenso en el cátodo, debido a la interacción de los electrones y los átomos de tungsteno pueden producir “profundidad” en el blanco.\nEs decir, los fotones que salen del ánodo, tienen que recorrer más distancia que los que salen del cátodo. Por tanto los fotones del ánodo serán menos intensos y estarán más filtrados.\n\nNormalmente es un efecto indeseado, pero lo usamos a nuestro favor en estudios como la MAMOGRAFÍA, para compensar las propias desigualdades de la estructura de la mama.\n\nGENERADOR DEL EQUIPO DE RX\nEs el conjunto de dispositivos eléctricos que permiten la comunicación con el tubo de Rayos X, éstos dispositivos, son variados y se dividen en 2 grandes áreas.\n\nZona de Bajo Voltaje: Integrado en la consola, mide el voltaje de llegada a la unidad y lo ajusta a 220V, convierte la tensión en dos diferentes, una para el tubo y otra para el filamento (con la selección de milis y kilos), y proporciona corriente al filamento para arrancar los electrones, los mA se refiere al nº de electrones que cruzan por segundo.\nEstá compuesta por: ⟶ compensación de línea ⟶ Autotransformador ⟶ Control de corriente\n\nZona de Alto Voltaje: Alojada en armarios eléctricos especiales, esta compuesta por:\n⟶ (1)Transformador de Alta Tensión (kV)\n⟶ (2)Rectificador de Tensión\n*(1) El AUTOTRANSFORMADOR, proporciona tal diferencia de potencial, que consigue que la señal de salida tenga el valor en kV exacto al que se ha seleccionado en la consola.\n*(2) Los tubos de RX, sólo funcionan con corriente continua, dado que el flujo de electrones sólo puede ser en dirección ánodo ⟶ cátodo, es necesario rectificar la tensión secundaria del trafico de alta tensión. Haciendo una conversión de corriente alterna a corriente continua.\n\nTIPOS DE TENSIONES:\nNo Rectificada ⟶ Muy primitivo, el tubo hacía de rectificador, pero no rectificaba la Alta Tensión.\nRectificada de Media Onda ⟶ Uno o dos diodos dentro del circuito de Alta Tensión, evitan que la tensión negativa llegue al tubo, pero no evitan que la radiación (emisión) sea pulsada.\nRectificada de Onda Completa ⟶ 4 o más diodos, permiten invertir las partes negativas de la corriente de tensión alterna, con ellos se consigue que la emisión sea continua.\nNota:\n*Corriente alterna, los electrones circulan en viajes muy cortos de ida y vuelta, en lugar de recorrer el circuito completo.\n*La frecuencia de una corriente alterna, es igual al nº de veces por segundo que acontece la Ida y Vuelta de los electrones. Se mide en hercios (Hz), que equivales a veces/segundo o ciclos/segundo.\n\nEMISIÓN DE RX\nFÍSICA:Los electrones que van desde el cátodo al ánodo, constituyen la “corriente del tubo”, cuando chocan contra los átomos del metal del blanco, interaccionan y transfieren su energía cinética.\nConforme suceden esas interacciones, los electrones disminuyen su velocidad y quedan casi en reposo, el ánodo los conduce hacia el circuito eléctrico, para que vuelvan por el transformador de alta tensión al filamento del cátodo y cerrar el circuito.\n\nEstas interacciones dan lugar a emisiones de energía diferentes:\nEmisión de calor ⟶ Casi toda la energía cinética que generan los electrones proyectil, se convierte en calor (99%)\n\nEmisión de Radiación Característica ⟶ Un electrón proyectil, interactúa con un electrón de una capa interna del átomo, con tanta fuerza como para ionizar el átomo => RAD. CARACTERÍSTICA\nEl electrón de la capa K que se ioniza, deja un hueco que se ocupa con otro de una capa externa, el Tungsteno por sus características permite que el hueco que queda, pueda ser ocupado por un electrón de cualquiera de las capas más externas (no tiene porque ser la inmediata).\nLa “transición” entre capas, va acompañada de la emisión de fotones de Rx, de energía igual a la diferencia entre la energía de enlace del electrón en la capa de origen y la energía de la capa de destino.\n**Sólo los Rayos X característicos de la capa K, son útiles ya que tienen una energía media de 69KeV.\n\nEmisión de Radiación de Frenado (Espectro Continuo) ⟶ El electrón proyectil pasa lo suficientemente cerca del núcleo del átomo del blanco como para interactuar con él “ATRACCIÓN ELECTROSTÁTICA”, entonces el electrón se frena y se desvía de su trayectoria perdiendo energía cinética y creando un fotón de Rx. El rayo producido tendrá una energía entre 0 y 70 KeV, por tanto en diagnóstico casi todos los rayos serán generados por Radiación de Frenado.`,
4:`TEMA 4. REGISTRO DE LA IMAGEN. PELICULAS/PANTALLAS/ INTENSIFICADORES DE IMAGEN\n\nPELÍCULAS RADIOGRÁFICAS: Es un receptor de imagen que convierte los Rx en una imagen visible y útil para el diagnóstico radiológico. Es más sensible a la luz visible que a los Rx, por ello se suelen usar pantallas intensificadoras, que convierten la energía de los Rx en luz visible.\n\nPARTES DE LA PELÍCULA:\nBase ⟶ Es de poliéster transparente y le confiere a la película la dureza y resistencia necesarias.\nEmulsión ⟶ Forma la imagen latente, es una mezcla de gelatina y cristales de halogenuro de plata. Las propiedades de la emulsión que determinan la Sensibilidad/Velocidad, Contraste y Resolución de la imagen, dependen de los activos empleados y las características de los halogenuros de plata.\nCapa Adhesiva ⟶ Mantiene unidas la base y la emulsión.\nRecubrimiento ⟶ Contiene la capa gelatinosa (emulsión)\n*Chasis ⟶ Estuche rígido contenedor de la película y la pantalla intensificadora.\n\nPROCESO DE FORMACIÓN DE IMÁGENES:\nCuando los cristales de halogenuro de la película reciben la luz que emite la pantalla de refuerzo al interaccionar con los Rx, se produce la “IMAGEN LATENTE”, después del proceso de revelado se obtiene la “IMAGEN VISIBLE”.\n\nTIPOS DE PELÍCULA:\nPelículas Exposición Directa ⟶ Son menos sensibles a la luz que las de pantalla, deber ser protegidas en envases de cartón herméticos (de la luz)\nPelículas de Pantalla ⟶ Son las más usadas en radiología, se utilizan con pantalla intensificadora.\n\nCaracterísticas:\n1.Sensitometría ⟶ Estudio y medición de la respuesta de la película debido a los cambios de exposición y las condiciones de revelado. Se representa por la “CURVA CARACTERÍSTICA”.\n2.Exposición ⟶ Cantidad de energía de Rx que alcanza un área determinada de la película.\n3.Latitud ⟶ Son los tiempos de exposición en que se consiguen las densidades optimas distinguibles por el ojo humano.\n4.Velocidad y Contraste ⟶ Describen la respuesta de la película a la exposición.\n5.Densidad Óptica ⟶ Mide el ennegrecimiento de la película. El intervalo útil de densidad óptica es la capacidad de distinguir los diferentes grises. Se mide con el DENSITÓMETRO.\n*Velo: densidad óptica ocasionada por factores ajenos a la radiación.\n6.Ley de reciprocidad ⟶ Indica que la densidad óptica, depende de la exposición total (mAs) y que es independiente del tiempo de exposición. Esta ley no se cumple para exposiciones muy cortas o muy largas, con pantalla de refuerzo.\n7.Curva Característica ⟶ Identifica el contraste y la velocidad de una película o un sistema con pantalla de refuerzo (que tienen mejor imagen que las directas)\n*Contraste: Es inversamente proporcional a la latitud ⟶ +latitud, -contraste.\n*Velocidad: Está inversamente relacionada con la exposición requerida para producir un determinado efecto, una película de alta velocidad, requiere menor tiempo de exposición.\n\nINTRODUCCIÓN Ventajas:\n⟶ Mayor contraste Radiográfico\n⟶ Menor radiación al Paciente\n⟶ Tiempos de exposición más cortos → menos borrosidad por movimiento.\n\nDiseños Según Características:\nPelícula Mamográfica ⟶ Emulsión Simple, de oxisulfuro de gadolinio, y recubrimiento antihalo (situada en la superficie opuesta de la pantalla) para mejorar la imagen.\nPelícula Láser ⟶ Son sensibles a la luz roja, de halogenuro de plata, se pueden conectar con TAC, RESO, Etc.. Ofrecen buena calidad de imagen y tienen múltiples tamaños.\nPelículas Especializadas ⟶ Son de dos tipos, las de cine de 35mm que necesitan un equipo especial para el procesado de la imagen. Y las de Spot que son de entre 70 y 105mm, facilitan el visionado, y se pueden procesar en un procesador automático de Rx convencional.\n\nCUIDADOS DE ALMACENAMIENTO Y MANIPULACIÓN:\nCALOR Y HUMEDAD ⟶ Almacenadas en lugares frescos (<20ºC) y secos.\nLUZ ⟶ Se deben evitar las filtraciones de luz,y las luces de “seguridad” instaladas en el almacén y durante la manipulación antes del procesado.\nRADIACIÓN ⟶ Se protegerán de fugas de Rx, del material radiactivo de MN, y de la radiación ambiente de la atmósfera.\nTIEMPO DE ALMACENAMIENTO ⟶ No más de 30 días aunque caducan a los 2 años, y en posición vertical.\n\nPANTALLA INTENSIFICADORA\nINTRODUCCIÓN Y DEFINICIÓN:\nTambién llamadas “de REFUERZO”, son superficies formadas por materiales capaces de transformar la energía de los Rx, en luz (efecto luminiscente). Esa luz será la que interactúe con la película formando la imagen LATENTE.\nDependiendo del tiempo de emisión de luz, el efecto se clasifica en:\nFLUORESCENCIA ⟶ El tiempo de exposición es igual al tiempo de emisión de los Rx.\nFLUORESCENCIA SEMIESTABLE ⟶ Dura entre 1 y varios segundos.\nFOSFORESCENCIA ⟶ Emite luz continua después de la radiación, “tiempo de permanencia” hasta que vuelve a la normalidad, es un efecto negativo para la imagen ya que produce borrosidad.\n**BENEFICIOS DEL EF. LUMINISCENTE: Necesita menos fotones y de menos energía para excitar los átomos del material luminiscente, comparado con la película radiográfica.\nUn solo fotón de Rx, produce miles de fotones de luz, por tanto, las pantallas de refuerzo intensifican la acción de los Rx, sobre la película.\n\nPARTES DE LA PANTALLA INTENSIFICADORA:\n1.Capa de Soporte: Es la capa más alejada de la película. Deber ser flexible, resistente y no decolorable con ausencia de impurezas que puedan generar artefactos. Debe ser un elemento que no altere el elemento luminiscente.\n2.Capa Reflectante: Está sobre la base, se encarga de dirigir los fotones de luz hasta la película y evita que se dispersen. Suele ser de Dióxido de Titanio u Oxido de Magnesio.\n3.Capa Luminiscente: Es donde se encuentran los cristales de fósforo, deben tener un nº atómico alto para aumentar la posibilidad de interacción con los Rx. Ser de alta conversión de fotones de luz, por cada uno de Rx. Tener la mínima capacidad de fosforescencia (para evitar borrosidad) y deben ser resistentes a los factores externos como el calor o la humedad.\n4.Capa Protectora: Es la más cercana a la película, protege la capa luminiscente (lo que facilita la limpieza de la pantalla), previene la electricidad estática lo que evita artefactos en la imagen.\n\nCARACTERÍSTICAS DE LA PANTALLA INTENSIFICADORA:\nFactor de INTENSIFICACIÓN ⟶ Indica la reducción de dosis para obtener la misma densidad radiográfica. El factor de intens. será mayor cuanto menor sea la exposición necesaria para obtener una radiografía de igual densidad utilizando pantalla.\n\nFACTORES QUE INTERVIENEN:\n1.Composición de la Pantalla\n2.Material utilizado\n3.Grosor de la capa fluorescente\n4.Tamaño y concentración de cristales\n5.Existencia de capa reflectante\n6.Factores que atañen al TÉCNICO ⟶ Kv utilizados (+Kv = + Fact. Intensificación)/ temperatura y tiempo de revelado (- tiempo = +Fact. Intensificación)\n7.Eficacia de Absorción: Es la diferencia entre los Rx que interaccionan con la pantalla y los Rx que salen.\n8.Eficacia de Conversión: Relación entre el nº de fotones de los Rx absorbidos y el nº de fotones de luz capaz de emitir Rx a la pantalla.\n9.Eficacia de pantalla: Nº de fotones de luz capaz de producir ennegrecimiento de los cristales de halogenuro de plata y producir la imagen latente en la pantalla.\n10.Velocidad de Pantalla: Viene dada por el tipo de material luminiscente utilizado y por el grosos y tamaño de los cristales. Una película rápida, es la que tiene una capa gruesa con cristales grandes PERO!, esto aumenta la borrosidad geométrica.\n11.Moteado Cuántico: Artefacto que consiste en la aparición de manchas (puntos), producido por la mala calidad del haz de Rx, cuanto -nº de fotones (mA) + Ruido.\n12.Borrosidad de la Imagen: Es la falta de resolución, y se produce por 3 mecanismos:\n1. Exposición cruzada: Los fotones que logran atravesar las dos capas de emulsión, dan lugar a una imagen falsa\n2. Tamaño del cristal: +Grande = + Borrosidad, llegando a falsear el tamaño de la imagen (p. de alta velocidad)\n3. Grosor de la Capa Luminiscente: +Grosor = +Borrosidad.\n\nTIPOS DE PANTALLAS INTENSIFICADORAS:\n1.SEGÚN VELOCIDAD (SENSIBILIDAD)\n1.1 Pantallas Lentas ⟶ Su índice de velocidad es de 50m, con cristales fluorescentes pequeños, ofrece imágenes de alta resolución y escaso moteado cuántico. Su uso para es estudio de partes pequeñas o partes blandas (mama).\n1.2 Pantallas Universales (Par-Speed) ⟶ Índice de 100/200m, buena calidad de imagen. Su uso puede ser para TX/ABD/COLUMNA Y PELVIS.\n1.3 Pantallas Graduadas/Compensadas ⟶ Se utilizan en Radiografías con distintas densidades ya que poseen diferentes zonas de velocidad y permiten compensar la imagen en zonas con distintas densidades como TELEMETRÍAS/ESCOLIOGRAMAS.\n1.4 Pantallas Asimétricas ⟶ Es una combinación de pantallas, Son muy útiles en exámenes de TX ya que ofrece imágenes optimas tanto de los pulmones como del mediastino que es más denso.\n2.SEGÚN EL ESPECTRO DE LUZ EMITIDO (CORRESPONDENCIA ESPECTRAL)\n2.1 Pantallas de Línea Azul ⟶ Son de Wolframio de calcio y algunas tierras raras como el Oxisulfuro de Itrio, emiten luz azul y violeta, las películas convencionales, son las más sensibles a éste tipo de pantalla.\n2.2 Pantallas de Línea Verde ⟶ Son de Oxisulfuro de gadolinio y Oxisulfuro de Lantano, deben combinarse con las películas ortocromáticas. Son más rápidas que las Azules y ofrecen el mismo grado de resolución.\n\nCUIDADOS DE MANIPULACIÓN Y MANTENIMIENTO:\nLimpieza ⟶ La periodicidad irá en función del uso\nManipulación ⟶ Es importante no doblar las esquinas y manipularlas en zonas secas, para evitar que se manchen con los productos químicos.\nContacto entre Placa-Película ⟶ La falta de contacto dará un artefacto característico en forma de falta de nitidez o ensombrecido de la imagen radiográfica.\n\nEL CHASIS\nDEFINICIÓN:\nEs el soporte de la pantalla/película o la pantalla directa, se ocupa de asegurar el contacto perfecto entre la pantalla y la película, a parte, se ocupa de proteger la película (de la luz) y la pantalla (de daños externos).\n\nCOMPOSICIÓN:\nEs una caja plana, formada por dos caras (frontal y trasera), unidas por bisagras y un sistema de cierre.\nCara Frontal (Tapa) ⟶ Es la que se coloca frente al Haz de Rx, debe ser de bajo nº atómico para atenuar lo mínimo posible el haz.\nCara Trasera (Cubierta) ⟶ Lleva un recubrimiento de plomo para disminuir la retrodispersión.\n\nTIPOS DE CHASIS\n⟶ Para Exposímetros AUTOMÁTICOS: Se colocan en la bandeja porta chasis. **Pueden NO tener recubrimiento posterior de plomo.\n⟶ Curvos y Flexibles: Se adaptan a la anatomía Ej: Ortopantomografía/Radiografías panorámicas.\n⟶ Con Rejilla Incorporada: Útiles en casos en los que no se puede usar la rejilla móvil Ej: Portátil/Quirófano\n⟶ Sin Pantalla: Para películas de una sola emulsión, para estudios muy concretos como la mamografía, aunque para aumentar la resolución también se aumenta la exposición.\n⟶ Para Cámaras MULTIFORMATO: No tienen pantalla intensificadora, disponen de dos chasis uno para las películas vírgenes y el otro para las películas expuestas. Sus usos pueden ser en estudios de ECO, RM, TAC, MN, Equipos de RX Digital.\n\nCUIDADOS DE ALMACENAJE Y MANTENIMIENTO:\n1. Evitar golpes que puedan deteriorar el cierre o el contacto\n2. Revisar el fieltro, que se acaba carbonizando por el uso.\n3. Almacenarlo cargado y en posición vertical.\n\nINTENSIFICADOR DE IMAGEN\nLa fluoroscopia produce una imagen continua, ideal para estudiar órganos en movimiento, o los flujos de los medios de contraste.\nFUNCIONAMIENTO:\nEl tubo funciona a menos de 5 mA, pero durante un tiempo muy prolongado, lo que aumenta mucho la dosis al paciente. La adquisición de la imagen se basa en la capacidad que tienen los Rx de causar fluorescencia en una material (fósforo), acoplando el tubo a una pantalla fluoroscópica. El intensificador ayuda tanto a bajar la dosis al paciente como a mejorar la calidad de imagen, amplificando la luz de la pantalla.\n**El tubo produce entre 50 y 75 fotones más de los que fueron necesarios para crearlos\n**La magnificación de la imagen aumenta la resolución y mejora el contraste, pero incrementa la dosis al paciente.\nCOMPONENTES:\nTubo Intensificador ⟶ Recibe el Haz de Rx y lo convierte en una imagen visible de alta intensidad\nPartes ⟶ Ampolla (de vidrio) ⟶ Pantalla de entrada (fotocátodo y fósforo) ⟶ Lentes Electrostáticas ⟶ Ánodo ⟶ Pantalla de Salida`,
5:`TEMA 5. EL PROCESADO DE LA IMAGEN, CALIDAD DE LA IMAGEN RADIOGRÁFICA Y RADIACIÓN DISPERSA\n\nINTRODUCCIÓN\nEl procesado hace visible la imagen latente, después de pasar por diferentes fases, esta etapa es tan importante como las anteriores.\n\nPROCESADO DE LA PELÍCULA\nEstá basado en una serie de reacciones químicas, trasportando la película a través de 4 secciones de la máquina donde se llevan a cabo los siguientes procesos\nREVELADO ⟶ Convierte la imagen latente en visible\nFIJADO ⟶ Elimina los halogenuros de plata que no se han revelado y endurece la gelatina (emulsión)\nLAVADO ⟶ Elimina el exceso de productos químicos que quedan en la película\nSECADO ⟶ Elimina el agua y prepara la película para su visualización y almacenaje.\n\nPRINCIPALES AGENTES REVELADORES\nLos más usados son la HIDROQUINONA (más lenta y aporta los tonos más oscuros), y la FENIDONA (más rápida e influyente sobre los tonos claros de la escala de grises). Pueden contener impurezas, para evitarlo, se añaden QUELATOS que forman complejos estables con esas impurezas.\n\n“INGREDIENTES DE LOS REVELADORES”:\nAGENTES ACELERADORES ⟶ Aumentan la velocidad de conversión de los halogenuros. Pueden ser de carbono de sodio/potasio o hidróxido sódico\nREVELADORES ⟶ Mantienen la actividad del revelador y previenen las manchas en la capa de la emulsión, ralentizan la oxidación de la solución (en revelado al aire). Normalmente son de sulfito de sodio o potasio.\nENDURECEDORES ⟶ Evitan que la emulsión se hinche demasiado, y facilitan el trasporte de la película a través de los rodillos de la máquina.\n\nPRINCIPALES AGENTES FIJADORES\nSe utilizan para evitar que la gelatina de la emulsión se hinche excesivamente, se utiliza sal de aluminio para endurecerla, que además acorta el tiempo de secado. Los más usador son el TRIOSULFATO DE AMONIACO y el TIOSULFATO DE SODIO.\n\nEL LAVADO\nUna vez completado el fijado, tiene lugar el lavado, el agente que se utiliza es el AGUA, la cual tiene que mantenerse 3ºC por debajo de la temperatura del revelador.\n\nEL SECADO\nUn ventilador de aire caliente es el componente principal de la sección de secado, gran parte del aire recircula en el sistema y el resto se expulsa para evitar excesiva humedad. Todo éste proceso se llevaba a cabo en el CUARTO OSCURO que debía estar protegido de la luz y las radiaciones ionizantes de las salas anexas. Por tanto paredes, suelos y techos debían estar plomados.\nA parte debía tener dos zonas de trabajo diferenciadas para extraer la película expuesta (ZONA SECA) y para alojar todos los tanques con los líquidos de revelado (ZONA HUMEDA).\n**Ha dejado de ser una “pieza clave” para los servicios de RX gracias a la implantación de la procesadora automática y de otros métodos de revelado.\n\nCOMPONENTES PRINCIPALES DE LA PROCESADORA AUTOMÁTICA\nBANDEJA DE ALIMENTACIÓN ⟶ Es dónde colocaremos la película para ser revelada.\nSISTEMA DE TRASPORTE ⟶ Conduce la película mediante RODILLOS (que a parte de transportar la película, agita las soluciones de manera uniforme, cuando trasporta la película por encima de ellos) a través de los tanques de REVELADO/FIJADO/LAVADO y SECADO.\nBASTIDORES ⟶ Donde se alojan los rodillos, hay un bastidor para cada depósito. (situados en la parte superior de cada depósito)\nMOTOR ⟶ Proporciona la potencia necesaria a todo el conjunto, su velocidad debe ser lo más constante posible.\nTERMOSTATOS ⟶ Controlan las temperaturas del revelador (35ºC) y la del agua (32ºC).\nSISTEMA DE CIRCULACIÓN ⟶ Asegura la continua agitación de los líquidos, para favorecer una correcta exposición de la emulsión.\nSISTEMA DE RELLENO ⟶ Asegura que el nivel de los líquidos sea siempre el idóneo para garantizar el tiempo de contacto con la película necesario y garantizar su calidad.\n**El tanque del agua no recircula, por tanto no se rellena**\nSISTEMA DE SECADO ⟶ Es un ventilador controlado por un termostato, aspira aire de la habitación y lo envía hacia los tubos de secado por unas resistencias que lo calientan.\n\nMETODOS ALTERNATIVOS\nEl ciclo habitual del procesado son 90s, pero existen otro tipo de procesador con distintos tiempos de procesado según las necesidades.\nPROCESADO RAPIDO ⟶ Dura unos 30s, ofrece la misma calidad, es muy útil para salas de Urgencias.\nPROCESADO EXTENDIDO ⟶ Puede durar hasta 3min. se usa sobre todo en MX, ya que la ventaja de éste tipo de procesado es que ofrece un mayor contraste en la imagen.\nPROCESADORAS LUZ-DÍA ⟶ Eliminan por completo el cuarto oscuro, el ciclo del procesado total (desde que se descarga el chasis, hasta la obtención de la imagen) es de 2 minutos. La única manipulación es rellenar el depósito de películas vírgenes.\nPROCESADO EN SECO ⟶ Substituye los líquidos para el procesado por otras tecnologías como la TERMOGRAFÍA o la FOTOTERMOGRAFÍA.\n**LAS PROCESADORAS AUTOMÁTICAS QUEDAN OBSOLETAS CON LA INTRODUCCIÓN DE LAS PROCESADORAS LUZ-DIA Y SOBRETODO EL PROCESADO EN SECO.\n\nRADIACIÓN DISPERSA\nINTRODUCCIÓN\nAl interaccionar con el paciente, el haz sufre distintos cambios\nEl haz DIRECTO ⟶ lo absorbe el paciente.\nEl haz PRIMARIO ⟶ atraviesa al paciente.\nEl “RESTO” del haz ⟶ se dispersa en múltiples direcciones.\nLa Radiación Dispersa, es la principal causa de irradiación de los profesionales, trabajadores y público en general. A demás es una de las causas en la pérdida de contraste en la imagen, y aumenta cuando mayor es el volumen irradiado a causa de la necesidad de aumentar la energía (kV).\n\nMETODOS PARA REDUCIRLA\n⟶ Reducción del Kilo Voltaje: Trabajar con valores más bajos ayuda a disminuir la radiación dispersa, pero para compensarlo es necesario aumentar los mAs, lo que aumenta la dosis al paciente.\n⟶ Reducir el Volumen Irradiado: Tenemos dos maneras 1 es reduciendo el espesor de la zona de estudio (compresión) y 2 limitar el haz en tamaño y forma para cubrir lo justo (colimar)\n⟶ Separación Objeto/Detector: La radiación dispersa se “produce en el paciente”, por tanto, si lo alejamos del detector, le llegará menos radiación dispersa. El problema es que entonces distorsionamos la imagen (“aumentado”)\n⟶ Rejillas Antidifusoras: Se sitúan entre el paciente y el receptor de imagen. Son básicamente una serie de láminas de plomo separadas y anguladas de tal manera, que dejan pasar el haz de Rx “entero” y retienen los “restos” del haz que se dispersan.\n\nGEOMETRÍA Y FORMACIÓN DE LA IMAGEN\nPara conseguir la mayor exactitud anatómica posible y una buena calidad de imagen, hay que tener en cuenta los factores que afectan a la formación de la imagen:\nAMPLIACIÓN ⟶ La imagen exacta aparece cuando el objeto está lo más cerca posible del receptor y lo más lejos del foco emisor.\nDISTORSIÓN ⟶ Es el resultado de una ampliación “desigual” Ej: Proyecciones oblicuas. En definitiva es la pérdida de nitidez.\nBORROSIDAD ⟶ El foco emisor, está formado por diferentes puntos, lo que provoca que produzca su propia sombra sobre el objeto (penumbra)\nMOVIMIENTO ⟶ Contribuye a la borrosidad, es fácil evitarlo inmovilizando la zona y acortando los tiempos de exposición.\n\nCONCLUSIONES:\nPara conseguir una buena formación de la imagen y que sea lo más exacta posible, colimaremos todo lo posible, la distancia foco/objeto será la máxima, el tubo estará paralelo al receptor y evitaremos el movimiento siempre que sea posible.`};
const Q={1:[['¿Quién descubrió los rayos X en 1895?',['Marie Curie','W.C. Röntgen','Hounsfield','Lauterbur'],1],['¿En qué fecha se realizó la primera radiografía de la mano de la mujer de Röntgen?',['8 de noviembre de 1895','22 de diciembre de 1895','1911','1979'],1],['¿Qué científico se relaciona con la mamografía en la cronología?',['Salomon','Purcell','Cormack','Tesla'],0],['¿En qué año aparece la primera promoción de técnicos de rayos?',['1961','1972','1977','1995'],2],['¿Qué título aparece en 2014?',['Técnico Superior en Imagen para el Diagnóstico y Medicina Nuclear','Enfermería especialista','Técnico de rayos','Radiólogo'],0]],2:[['El número atómico Z corresponde a:',['Número de neutrones','Cantidad de protones','Cantidad de electrones externos','Masa del átomo'],1],['Los electrones más cercanos al núcleo tienen:',['Poca energía y mucha ligadura','Mucha energía y poca ligadura','Mucha energía y mucha ligadura','Poca energía y poca ligadura'],0],['Cuando un electrón pasa a una capa superior necesita:',['Perder energía','Ganar energía','No intercambiar energía','Emitir siempre rayos X'],1],['La ionización ocurre cuando:',['Se arranca un electrón del átomo','El electrón cambia de capa sin energía','El núcleo pierde un neutrón siempre','El átomo se hace neutro'],0],['En el efecto Compton el fotón incidente:',['Desaparece al ser absorbido','Interacciona con electrones externos y pierde energía','Se convierte en positrón','No cambia su trayectoria'],1],['En el efecto fotoeléctrico el fotón incidente:',['Es absorbido por el átomo','Se dispersa sin perder energía','Produce siempre dos fotones','Solo interactúa con el núcleo'],0],['La producción de pares requiere como mínimo:',['102 KeV','1.020 KeV','10.000 KeV','69 KeV'],1],['Alejarse el doble del foco implica una intensidad:',['Doble','Cuádruple','Cuatro veces menor','Igual'],2]],3:[['¿Qué elemento del equipo emite los rayos X?',['Colimador','Tubo de Rx','Mesa','Bucky mural'],1],['¿Dónde impactan los electrones procedentes del cátodo?',['En el ánodo','En el filamento','En el colimador','En el transformador'],0],['Los tubos de Rx suelen tener dos puntos focales:',['Azul y verde','Fino y grueso','Interno y externo','Primario y secundario'],1],['El efecto talón hace que el haz sea más intenso en:',['Ánodo','Cátodo','Centro siempre','Ninguno'],1],['El autotransformador permite seleccionar con precisión:',['mA','kV','Tiempo de revelado','Frecuencia'],1],['Los tubos de Rx funcionan con:',['Corriente continua','Corriente alterna sin rectificar','Solo corriente estática','Corriente variable sin rectificación'],0],['La radiación de frenado se produce cuando el electrón proyectil:',['Pasa cerca del núcleo y se frena/desvía','Se queda en el filamento','Se convierte en protón','No interacciona con el blanco'],0],['Aproximadamente qué porcentaje de la energía de los electrones se convierte en calor?',['1%','10%','50%','99%'],3]],4:[['La emulsión de una película radiográfica contiene:',['Gelatina y cristales de halogenuro de plata','Solo poliéster','Plomo y cobre','Agua y aluminio'],0],['La imagen latente se convierte en visible mediante:',['La colimación','El revelado','La fluoroscopia','La compresión'],1],['La densidad óptica mide:',['El ennegrecimiento de la película','El tamaño del chasis','La dosis al paciente','La frecuencia'],0],['La ley de reciprocidad relaciona la densidad óptica con:',['La exposición total (mAs)','Solo el tiempo','Solo el kV','El tamaño del píxel'],0],['El contraste es inversamente proporcional a:',['La velocidad','La latitud','La densidad','La exposición'],1],['La capa luminiscente de una pantalla contiene:',['Cristales de fósforo','Plomo','Poliéster','Agua'],0],['Una pantalla con cristales grandes suele producir:',['Más resolución y menos borrosidad','Más borrosidad','Menos velocidad','Menos luminiscencia'],1],['La cara trasera del chasis lleva plomo para:',['Aumentar la dosis','Disminuir la retrodispersión','Aumentar el contraste siempre','Refrigerar'],1],['La m function showSection(x){document.getElementById('temas').classList.toggle('hidden',x!=='temas');document.getElementById('tests').classList.toggle('hidden',x!=='tests');document.getElementById('tabTemas').classList.toggle('active',x==='temas');document.getElementById('tabTests').classList.toggle('active',x==='tests');if(x==='tests')showTests();else closeTopic()}function openTopic(n){document.getElementById('topicList').classList.add('hidden');document.getElementById('topicView').classList.remove('hidden');document.getElementById('topicText').textContent=topics[n]}function closeTopic(){document.getElementById('topicList').classList.remove('hidden');document.getElementById('topicView').classList.add('hidden')}function showTests(){document.getElementById('testMenu').classList.remove('hidden');document.getElementById('quiz').classList.add('hidden');document.getElementById('res').classList.add('hidden');document.getElementById('testTopics').innerHTML=Object.keys(Q).map(n=>`<div class="testTopic" onclick="start(${n})"><b>📝 ${labels[n]}</b><br><span class="small">${Q[n].length} preguntas</span></div>`).join('')}let topic=0,i=0,hits=0,ans=[];function start(n){topic=n;i=0;hits=0;ans=[];document.getElementById('testMenu').classList.add('hidden');document.getElementById('res').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');document.getElementById('m').textContent='📚 Modo estudio';show()}function show(){let x=Q[topic][i],total=Q[topic].length;document.getElementById('n').textContent=`Pregunta ${i+1} de ${total}`;document.getElementById('p').style.width=(i/total*100)+'%';document.getElementById('q').textContent=x[0];document.getElementById('o').innerHTML='';document.getElementById('f').classList.add('hidden');document.getElementById('next').classList.add('hidden');x[1].forEach((t,j)=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${'ABCD'[j]})</b> ${t}`;b.onclick=()=>answer(j,b);document.getElementById('o').appendChild(b)});document.getElementById('next').textContent=i===total-1?'Ver resultado 🏆':'Siguiente pregunta →'}function answer(j,b){let x=Q[topic][i],bs=[...document.querySelectorAll('.opt')];bs.forEach(z=>z.disabled=true);ans[i]=j;if(j===x[2]){hits++;b.classList.add('correct')}else{b.classList.add('wrong');bs[x[2]].classList.add('correct')}document.getElementById('f').classList.remove('hidden');document.getElementById('f').innerHTML=`<b>${j===x[2]?'✅ ¡Correcta!':'❌ Incorrecta'}</b><br>Respuesta correcta: ${x[1][x[2]]}`;document.getElementById('p').style.width=((i+1)/Q[topic].length*100)+'%';document.getElementById('next').classList.remove('hidden')}function next(){if(i<Q[topic].length-1){i++;show()}else result()}function result(){document.getElementById('quiz').classList.add('hidden');document.getElementById('res').classList.remove('hidden');let total=Q[topic].length,pct=Math.round(hits/total*100);document.getElementById('score').textContent=(hits/total*10).toFixed(1)+'/10';document.getElementById('msg').innerHTML=`<b>${pct>=90?'🔥 ¡Nivelazo!':pct>=70?'💪 ¡Muy bien!':pct>=50?'📚 Aprobado, toca repasar':'🧠 Vamos a reforzar este tema'}</b><br>${hits}/${total} aciertos · ${pct}%`;let w=Q[topic].map((x,k)=>[x,k]).filter(z=>ans[z[1]]!==z[0][2]);document.getElementById('review').innerHTML=w.length?'<h3>📌 Para repasar</h3><ol>'+w.map(z=>`<li><b>${z[0][0]}</b><br><span class="small">Correcta: ${z[0][1][z[0][2]]}</span></li>`).join('')+'</ol>':'<h3>🏆 ¡Perfecto!</h3><p>Has acertado todas las preguntas.</p>'}showTests();
